function renderEvents(){const es=S.events.slice(0,3);$('events').innerHTML=es.map(e=>'<article class="event"><div class="tag '+(e.tag==='warning'?'warning':'')+'">'+escapeHTML(e.tag)+'</div><p>'+escapeHTML(e.title)+'. '+escapeHTML(e.body.slice(0,95))+(e.body.length>95?'…':'')+'</p><time>'+gameDate(e.month).toLocaleDateString('en',{month:'short',year:'numeric',timeZone:'UTC'})+'</time></article>').join('');}
function renderHead(){const n=current(),owned=n.id===S.player;const tabs=view==='policies'?[['reforms','Reforms'],['programs','Programs'],['taxation','Taxation'],['ideologies','Ideologies']]:view==='overview'?[['overview','Overview'],['society','Society']]:[];$('countryhead').innerHTML='<div class="eyebrow">'+(owned?'Your nation':'Nation intelligence')+'</div><div class="countryrow"><span class="flag">'+n.flag+'</span><h2>'+escapeHTML(n.name)+'</h2></div><div class="countrymeta">'+regime(n)+'</div><select aria-label="Select nation" id="nationSelect">'+[...S.nations].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>'<option value="'+c.id+'"'+(c.id===n.id?' selected':'')+'>'+c.name+'</option>').join('')+'</select><div class="subtabs">'+tabs.map(([k,label])=>'<button data-sub="'+k+'" class="'+(subview===k||(k==='programs'&&subview==='program')?'active':'')+'">'+label+'</button>').join('')+'</div>';$('nationSelect').onchange=e=>choose(e.target.value);$('countryhead').querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{subview=b.dataset.sub;renderHead();renderPanel()});}
function overview(n){const ide=ideology(n.policies);if(subview==='society')return '<div class="block"><h3>Society & institutions</h3>'+metric('Civil liberties',n.policies.liberties.toFixed(0)+' / 100')+metric('Institutional strength',n.capacity.toFixed(0)+' / 100')+metric('Income inequality',n.inequality.toFixed(1)+' / 100')+metric('Unemployment',n.unemployment.toFixed(1)+'%')+metric('Human capital',n.human.toFixed(0)+' / 100')+metric('Clean energy progress',n.clean.toFixed(0)+' / 100')+metric('Urban population',n.urban.toFixed(1)+'%')+metric('Living informally',n.slums.toFixed(1)+'%')+metric('Public housing stock',n.publicHousing.toFixed(1)+'% of housing need')+metric('Effective renter burden',n.rentBurden.toFixed(1)+'% of income')+metric('Housing supply index',n.housingSupply.toFixed(0)+' / 100')+'</div><div class="block"><h3>Political calendar</h3>'+metric('Next election',n.policies.institutions>=60?n.election+' months':'No competitive cycle')+'<p>Institutions and liberties are independent of the left–right economic spectrum. Elections allocate seats between the fictional parties. Coalition platforms can be staged from the Parties view.</p></div><p class="note">Social indicators are game indices. They are not measured current country scores.</p>';
return (n.id!==S.player?'<button class="primary full" data-action="assume">Play as '+escapeHTML(n.name)+'</button><p>Switch perspective without restarting the world.</p>':'<div class="hudtip">Your next move: draft a reform in <b>Policies</b>, then advance time with <b>▶</b> or <b>▸|</b>.</div>')+'<div class="block"><h3>National outlook</h3>'+metric('Stability',n.stability.toFixed(0)+' / 100','positive')+'<div class="bar"><div style="width:'+n.stability+'%"></div></div>'+metric('Public approval',n.approval.toFixed(0)+'%')+metric('Inflation',n.inflation.toFixed(1)+'%',n.inflation>6?'negative':'')+metric('Government debt',(n.debt/n.gdp*100).toFixed(1)+'% of GDP',n.debt/n.gdp>1?'neutral':'')+'</div><div class="block"><div class="sectionhead"><h3 style="margin:0">Economic trajectory</h3><span class="positive" style="font-size:12px">'+pct(n.growth)+'</span></div>'+sparkline(n.history)+'<div class="chartlabels"><span>START OF RECORDED PERIOD</span><span>'+dateText().toUpperCase()+'</span></div></div><div class="ideologybox"><div class="eyebrow">Economic policy profile</div><strong>'+ide.label+(ide.mixed?' · mixed':'')+'</strong><p>'+PRESETS[ide.label].desc+'</p></div><button class="full" data-action="policies">Shape domestic policy <span style="float:right">→</span></button><p class="keyboardhint">Space: play / pause &nbsp; · &nbsp; N: next month</p><p class="note">'+provenance(n)+'</p>';}
function policyControl(x,n){return(x.group?'<div class="eyebrow policygroup">'+x.group+'</div>':'')+'<div class="policy"><label class="metricrow" for="p-'+x.key+'"><span>'+x.name+'</span><output id="o-'+x.key+'">'+draft[x.key].toFixed(x.step<1?2:0)+' '+x.unit+'</output></label><input type="range" id="p-'+x.key+'" data-policy="'+x.key+'" min="'+x.min+'" max="'+x.max+'" step="'+x.step+'" value="'+draft[x.key]+'" '+(n.id!==S.player?'disabled':'')+'><div class="policylive"><span>Current: '+n.policies[x.key].toFixed(1)+'</span><span>Target: '+n.targets[x.key].toFixed(1)+'</span></div><small>'+x.desc+'</small></div>';}
function reformFooter(n){return '<div class="stickyaction"><div id="reformPreview"></div><button class="primary full" id="enact" '+(n.id!==S.player?'disabled':'')+'>Enact reform</button><button class="ghost full" data-action="discard">Reset draft to targets</button></div>';}
function policiesPanel(n){
 if(!draft)draft={...n.targets};
 if(subview==='ideologies')return '<h3>Choose a policy direction</h3><p>Presets stage an editable economic package. Your tax structure, housing programs, civil liberties and electoral safeguards stay independently adjustable.</p>'+Object.entries(PRESETS).map(([k,p])=>'<button class="preset" data-preset="'+k+'"><strong>'+k+' <span style="float:right;color:var(--accent)">↗</span></strong><small>'+p.desc+'</small></button>').join('')+'<p class="note">No ideology receives an automatic bonus. Outcomes emerge from its policies, institutional capacity and budget.</p>';
 if(subview==='taxation')return '<h3>Who pays what?</h3><p>Choose the tax structure, then set rates. The budget preview includes your other staged reforms.</p><label class="eyebrow" for="taxMode">Personal taxation system</label><select id="taxMode" class="full" '+(n.id!==S.player?'disabled':'')+'>'+TAX_MODES.map(m=>'<option value="'+m+'" '+(draft.taxMode===m?'selected':'')+'>'+TAX_NAMES[m]+'</option>').join('')+'</select><p class="note" id="taxExplanation">'+taxExplanation(draft.taxMode)+'</p>'+POLICY.filter(x=>(x.key==='tax'||x.tax)&&policyActive(x,draft)).map(x=>{const v={...x,group:undefined};if(BRACKET_KEYS.includes(x.key)){const i=BRACKET_KEYS.indexOf(x.key);v.name=draft.taxMode==='custom'?GROUPS[i].name+' · effective rate':['0–0.5× median · marginal','0.5–1.5× median · marginal','1.5–3× median · marginal','Above 3× median · marginal'][i];}return policyControl(v,n)}).join('')+'<div id="taxPreview"></div>'+reformFooter(n);
 if(subview==='programs')return programList(n);
 if(subview==='program')return programPage(n);
 return '<h3>Domestic reform</h3><p>Set policy targets. Implementation is gradual; construction and institutions take longer.</p><button class="full" data-action="taxation">Taxation · '+TAX_NAMES[draft.taxMode]+' →</button><button class="full" data-action="programs">Programs · urbanization, housing, debt relief →</button><p class="keyboardhint">Programs bundle the levers a policy actually needs, and show you what each one is doing month by month.</p>'+POLICY.filter(x=>x.key!=='tax'&&!x.tax).map(x=>policyControl(x,n)).join('')+reformFooter(n);
}
const progressBar=v=>'<div class="bar" style="margin:-6px 0 16px"><div style="width:'+clamp(v,0,100)+'%"></div></div>';
function programHeadline(key,n){const b=fiscal(n);
 if(key==='urban')return n.urban.toFixed(0)+'% urban · '+n.slums.toFixed(0)+'% informal · '+b.cityProgram.toFixed(2)+'% GDP committed';
 if(key==='housing')return n.publicHousing.toFixed(1)+'% of need met · rents at '+n.rentBurden.toFixed(0)+'% of income';
 if(key==='debt')return b.debtRatio.toFixed(0)+'% of GDP · '+b.interest.toFixed(1)+'% interest · '+b.debtService.toFixed(1)+'% GDP served';
 if(key==='human')return 'Human capital '+n.human.toFixed(0)+'/100 · '+(n.policies.services+n.policies.childcare).toFixed(1)+'% GDP committed';
 return 'Clean energy '+n.clean.toFixed(0)+'/100 · transition effort '+n.policies.climate.toFixed(0)+'/100';}
function programStatus(key,n){const b=fiscal(n),p=n.policies;
 if(key==='urban'){const strain=n.urbanStrain||0;return metric('Urban population',n.urban.toFixed(1)+'% of people')+progressBar(n.urban)+metric('Living informally',n.slums.toFixed(1)+'% of people',n.slums>25?'negative':n.slums<8?'positive':'')+progressBar(n.slums)+metric('Serviced city capacity',n.urbanCapacity.toFixed(0)+' / 100')+progressBar(n.urbanCapacity)+metric('Opening this month',n.urbanOpened.toFixed(3)+' capacity points')+metric('Under construction',n.urbanPipeline.reduce((a,v)=>a+v,0).toFixed(2)+' capacity points')+metric('Migration to cities',((n.migration||0)*12).toFixed(2)+' pp / year')+metric('Absorption',(strain>0?'Overrun by '+strain.toFixed(2):'Spare capacity '+Math.abs(strain).toFixed(2)),strain>0?'negative':'positive')+metric('Agglomeration effect on growth',pct(n.agglomeration),n.agglomeration>=0?'positive':'negative')+metric('Program cost',b.cityProgram.toFixed(2)+'% of GDP')+'<p>Districts open 18 months after ground is broken. When people arrive faster than serviced land, the excess becomes informal settlement, which pushes up rents and inequality and cancels the productivity gain of a bigger city.</p>';}
 if(key==='housing')return metric('Public housing stock',n.publicHousing.toFixed(1)+'% of need')+progressBar(n.publicHousing*1.25)+metric('Under construction',n.housingPipeline.reduce((a,v)=>a+v,0).toFixed(2)+'% of need')+metric('Completed this month',n.housingCompleted.toFixed(3)+' pp')+metric('Private supply response',n.housingSupply.toFixed(0)+' / 100')+metric('Effective renter burden',n.rentBurden.toFixed(1)+'% of income',n.rentBurden>40?'negative':n.rentBurden<25?'positive':'')+metric('Annual upkeep',b.housingMaintenance.toFixed(2)+'% of GDP')+'<p>Completions arrive 24 months after funding starts. Homes built stay built once construction spending is cut, but upkeep and 1.2% annual deterioration continue.</p>';
 if(key==='debt'){const headroom=Math.max(0,4.5-b.debtRatio/100);return metric('Debt stock',money(n.debt))+metric('Debt to output',b.debtRatio.toFixed(0)+'% of GDP',b.debtRatio>200?'negative':b.debtRatio<90?'positive':'')+progressBar(b.debtRatio/4.5)+metric('Interest rate carried',b.interest.toFixed(2)+'%')+metric('Annual interest bill',b.debtService.toFixed(2)+'% of GDP')+metric('Debt-management posture',p.borrowing.toFixed(0)+' / 100')+metric('Fiscal balance',pct(b.balance),b.balance>=0?'positive':'negative')+metric('Headroom to forced terms',(headroom*100).toFixed(0)+' pp of GDP',headroom<.5?'negative':'positive')+'<p>Interest only starts rising once debt passes 110% of output, and debt management buys the rate down further. Forced restructuring now waits until 450% of GDP, and a voluntary operation below that always costs less.</p>';}
 if(key==='human')return metric('Human capital',n.human.toFixed(0)+' / 100')+progressBar(n.human)+metric('Institutional capacity',n.capacity.toFixed(0)+' / 100')+progressBar(n.capacity)+metric('Unemployment',n.unemployment.toFixed(1)+'%')+metric('Income inequality',n.inequality.toFixed(1)+' / 100')+metric('Committed',(p.services+p.childcare+p.welfare).toFixed(2)+'% of GDP')+'<p>Human capital moves on a ten-year timescale and its ceiling depends on institutional capacity. Childcare pays back faster, through labor participation.</p>';
 return metric('Clean energy progress',n.clean.toFixed(0)+' / 100')+progressBar(n.clean)+metric('Transition effort',p.climate.toFixed(0)+' / 100')+progressBar(p.climate)+metric('Infrastructure',n.infra.toFixed(0)+' / 100')+progressBar(n.infra)+metric('Transition cost',(p.climate*.02).toFixed(2)+'% of GDP')+metric('Exposure to energy shocks',(100-n.clean).toFixed(0)+' / 100',n.clean>70?'positive':'')+'<p>Cleaner energy reduces the damage from the supply shocks that arrive later in a run. The stock moves slowly, so the effort has to be sustained.</p>';}
function reliefControls(n){const you=player(),cool=you.reliefCooldown||0,owned=n.id===S.player;return '<h3>Relief operations</h3>'+'<p class="keyboardhint">Voluntary operations, available at any debt level and repeatable. Each costs political capital, not a crisis.</p>'+Object.entries(RELIEF).map(([k,r])=>'<button class="preset" data-relief="'+k+'" '+(!owned?'disabled':'')+'><strong>'+r.name+' <span style="float:right;color:var(--accent)">'+(infiniteCapital(you)?'∞':r.cost+' capital')+'</span></strong><small>'+r.desc+'</small></button>').join('');}
function programList(n){return '<h3>Programs</h3><p>Named packages you can open, stage and then manage month by month. Each one bundles the levers it needs and reports what it is actually doing.</p>'+PROGRAMS.map(pr=>'<button class="preset" data-program="'+pr.key+'"><strong>'+pr.name+' <span style="float:right;color:var(--accent)">→</span></strong><small>'+pr.tag+' · '+programHeadline(pr.key,n)+'</small></button>').join('')+'<p class="note">Opening a program commits nothing. Stage it, check the budget line, then enact.</p>';}
function programPage(n){const pr=PROGRAMS.find(x=>x.key===activeProgram)||PROGRAMS[0];
 return '<button class="ghost full" data-action="programs" style="text-align:left">← All programs</button><h3>'+pr.name+'</h3><p>'+pr.blurb+'</p><div id="programLive">'+programLive(pr,n)+'</div>'+pr.keys.map(k=>policyControl({...POLICY.find(x=>x.key===k),group:undefined},n)).join('')+reformFooter(n);}
// The live block re-renders on every tick; the sliders around it must not, or a drag in progress would be lost.
function programLive(pr,n){return '<div class="block">'+programStatus(pr.key,n)+'</div>'+(pr.key==='debt'?reliefControls(n)+'<div class="policygroup eyebrow">Ongoing settings</div>':'<button class="full" data-stage="'+pr.key+'" '+(n.id!==S.player?'disabled':'')+'>Stage the full program</button><p class="keyboardhint">'+pr.stageNote+'</p>');}
function refreshProgramLive(){const box=$('programLive'),pr=PROGRAMS.find(x=>x.key===activeProgram);if(!box||!pr)return;box.innerHTML=programLive(pr,current());bindPrograms();}
function debtRelief(kind){const n=player(),r=RELIEF[kind];if(!r)return;
 
 if(!S.options.freeReforms&&!canSpend(n,r.cost)){toast('Not enough political capital for this operation.');return;}
 if(!S.options.freeReforms)spendCapital(n,r.cost);
 n.reliefCooldown=r.cooldown;
 if(kind==='terms'){n.targets.borrowing=clamp(n.targets.borrowing+20,0,100);n.policies.borrowing=clamp(n.policies.borrowing+12,0,100);addEvent('Maturities renegotiated',n.name+' lengthened the maturity profile of its debt. Carrying costs fall gradually.','economy');}
 if(kind==='refinance'){n.debt*=.93;n.targets.borrowing=clamp(n.targets.borrowing+12,0,100);n.policies.borrowing=clamp(n.policies.borrowing+8,0,100);addEvent('Concessional refinancing agreed',n.name+' swapped market debt for concessional lending. About 7% of the stock was written off.','economy');}
 if(kind==='restructure'){n.debt*=.7;n.approval=clamp(n.approval-7,5,95);n.growth-=1.2;n.debtWarned=0;for(const o of S.nations)if(o.id!==n.id)setRelation(n.id,o.id,relation(n.id,o.id)-6);addEvent('Sovereign debt restructured',n.name+' negotiated a 30% write-down. Creditors and partners took it badly; the budget did not.','economy');}
 if(draft)draft.borrowing=n.targets.borrowing;
 render();toast(r.name+' completed.');}
function taxExplanation(mode){return mode==='simple'?'An overall tax-to-GDP setting, preserving the original game model. Income groups share an assumed flat personal-tax component.':mode==='flat'?'Every group pays the same percentage of personal income. Other taxes and contributions are budget revenue measured as a share of GDP.':mode==='progressive'?'Marginal rates apply only to the income slice in each bracket. A higher bracket never reprices the income below it. Set the first rate to 0% for a tax-free first bracket.':'Each representative income group pays its own effective rate on its whole income. This is a sandbox group model, not marginal tax brackets.';}
function renderTaxPreview(){if(!$('taxPreview')||!draft)return;const n=current(),t=taxation(draft),median=n.gdp/n.pop*1000*PERSONAL_SHARE/INCOME_MEAN,problem=taxProblem(draft);$('taxPreview').innerHTML=(problem?'<p class="note negative">'+problem+'</p>':'')+'<h3>Representative people · at target rates</h3><p class="keyboardhint">Illustrative median personal income: $'+Math.round(median).toLocaleString()+'/year. Group weights are game assumptions.</p>'+t.groups.map(g=>'<div class="minicard" style="margin:10px 0"><label>'+g.name+' · '+Math.round(g.share*100)+'% of people</label>'+metric('Gross yearly income','$'+Math.round(g.income*median).toLocaleString())+metric('Personal tax rate',g.effective.toFixed(1)+'% effective')+metric('After personal tax','$'+Math.round((g.income-g.tax)*median).toLocaleString())+'</div>').join('')+metric('Personal income tax revenue',t.personal.toFixed(1)+'% GDP before collection')+'<p class="note">Personal income is assumed to be 65% of GDP. Actual revenue also depends on collection capacity. Brackets scale with modeled median income; no country’s real tax law is reproduced.</p>';}
function updateReformPreview(){refreshProgramLive();if(!$('reformPreview')||!draft)return;const n=current(),b=fiscal(n,draft),cost=reformCost(n,draft),problem=taxProblem(draft);$('reformPreview').innerHTML=(problem?'<p class="negative">'+problem+'</p>':'')+'<p>Budget at target policies: <b class="'+(b.balance<0?'negative':'positive')+'">'+pct(b.balance)+' of GDP</b> annually.<br>Includes current housing upkeep; future stock needs more maintenance.</p>';$('enact').textContent=infiniteCapital(n)?'Enact reform · ∞ capital':S.options.freeReforms?'Enact reform · free reforms':'Enact reform · '+cost+' capital';$('enact').disabled=n.id!==S.player||(!S.options.freeReforms&&!canSpend(n,cost))||cost===0||!!problem;renderTaxPreview();}
function economyPanel(n){const b=fiscal(n);return '<div class="block"><h3>National accounts</h3><div class="previewgrid"><div class="minicard"><label>Annual output</label><strong>'+money(n.gdp)+'</strong></div><div class="minicard"><label>Output per person</label><strong>$'+Math.round(n.gdp/n.pop*1000).toLocaleString()+'</strong></div></div>'+metric('Annual real growth',pct(n.growth),n.growth>=0?'positive':'negative')+metric('Inflation',n.inflation.toFixed(1)+'%')+metric('Central-bank rate',n.policies.rate.toFixed(1)+'%')+sparkline(n.history)+'</div><div class="block"><h3>Annual public budget · % of GDP</h3>'+metric('Personal income tax',b.personalRevenue.toFixed(1)+'%')+metric('Other taxes & contributions',b.otherRevenue.toFixed(1)+'%')+metric('Public-asset revenue',b.assetRevenue.toFixed(1)+'%')+metric('Total revenue',b.revenue.toFixed(1)+'%')+metric('Public services',n.policies.services.toFixed(1)+'%')+metric('Social protection',n.policies.welfare.toFixed(1)+'%')+metric('Infrastructure',n.policies.investment.toFixed(1)+'%')+metric('Defense',n.policies.defense.toFixed(1)+'%')+metric('Public housing construction',n.policies.housing.toFixed(2)+'%')+metric('Public housing upkeep',b.housingMaintenance.toFixed(2)+'%')+metric('Rent assistance',n.policies.rentAid.toFixed(2)+'%')+metric('Public transport',n.policies.transit.toFixed(2)+'%')+metric('Childcare',n.policies.childcare.toFixed(2)+'%')+metric('City building',n.policies.urbanization.toFixed(2)+'%')+metric('Industrial drive',n.policies.industrial.toFixed(2)+'%')+metric('Settlement upgrading',n.policies.slumUpgrade.toFixed(2)+'%')+metric('Rural development',n.policies.ruralInvest.toFixed(2)+'%')+metric('Debt management',b.debtAdmin.toFixed(2)+'%')+metric('Transition & administration',(5+n.policies.climate*.02).toFixed(1)+'%')+metric('Interest payments',b.debtService.toFixed(1)+'%')+metric(b.balance>=0?'Fiscal surplus':'Fiscal deficit',pct(b.balance),b.balance>=0?'positive':'negative')+metric('Debt stock',money(n.debt))+'</div><div class="block"><h3>Housing program</h3>'+metric('Public housing stock',n.publicHousing.toFixed(1)+'% of need')+metric('Under construction',n.housingPipeline.reduce((a,v)=>a+v,0).toFixed(2)+'% of need')+metric('Completed this month',n.housingCompleted.toFixed(3)+' percentage points')+metric('Effective renter burden',n.rentBurden.toFixed(1)+'% of income')+'<p>Projects take 24 months. Built homes remain after construction funding is cut, with ongoing upkeep and gradual deterioration.</p></div><div class="block"><h3>Urbanization</h3>'+metric('Urban population',n.urban.toFixed(1)+'%')+metric('Living informally',n.slums.toFixed(1)+'%')+metric('Serviced city capacity',n.urbanCapacity.toFixed(0)+' / 100')+metric('Migration to cities',((n.migration||0)*12).toFixed(2)+' pp / year')+metric('Agglomeration effect on growth',pct(n.agglomeration))+'</div><div class="block"><h3>Debt position</h3>'+metric('Debt to output',b.debtRatio.toFixed(0)+'% of GDP')+metric('Interest rate carried',b.interest.toFixed(2)+'%')+metric('Annual interest bill',b.debtService.toFixed(2)+'% of GDP')+metric('Debt-management posture',n.policies.borrowing.toFixed(0)+' / 100')+'<p>Interest rises only above 110% of output. Relief operations are in Policies → Programs → Debt relief.</p></div><p class="note">Output and debt use constant 2026 US dollars. Initial values are rounded scenario assumptions. Debt accumulates monthly; interest costs respond to rates and debt pressure.</p><button class="full" data-action="policies">Adjust fiscal policy →</button>';}
function diplomacyPanel(n){const p=player(),self=n.id===p.id;const choices=S.nations.filter(x=>x.id!==p.id).sort((a,b)=>b.gdp-a.gdp);return '<h3>Foreign relations</h3><p>'+(self?'Select another nation to negotiate, trade, or apply sanctions.':'Relations with '+p.name+' are '+(relation(p.id,n.id)>20?'cooperative':relation(p.id,n.id)>-20?'pragmatic':'strained')+'.')+'</p>'+(self?'<label class="eyebrow" for="partner">Diplomatic partner</label><select id="partner" class="full">'+choices.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('')+'</select><button class="primary full" id="inspectPartner">Open diplomatic channel →</button>':'<div class="block">'+metric('Bilateral relations',Math.round(relation(p.id,n.id))+' / 100')+'<div class="bar"><div style="width:'+(relation(p.id,n.id)+100)/2+'%"></div></div>'+metric('Trade agreement',hasTreaty(p.id,n.id)?'Active':'None')+metric('Sanctions',S.sanctions.includes(pair(p.id,n.id))?'Active':'None')+'</div><button class="full" data-diplomacy="improve" '+(!canSpend(p,8)?'disabled':'')+'>Improve relations · 8 capital</button><button class="full" data-diplomacy="trade" '+(hasTreaty(p.id,n.id)||!canSpend(p,15)||p.war?.target===n.id?'disabled':'')+'>Propose trade agreement · 15 capital</button><p>Agreements require relations above 25 and openness above 40 in both nations.</p><button class="full" data-diplomacy="sanction">'+(S.sanctions.includes(pair(p.id,n.id))?'Lift sanctions':'Impose sanctions · 10 capital')+'</button><p>Sanctions reduce output in both nations and damage bilateral relations.</p>')+'<div class="block" style="margin-top:24px"><h3>Your active agreements</h3>'+(S.treaties.filter(t=>t.split(':').includes(p.id)).map(t=>metric(nation(t.split(':').find(id=>id!==p.id)).name,'Trade pact')).join('')||'<p>No trade agreements yet.</p>')+'</div><p class="note">Diplomacy starts from neutral game assumptions. Real alliances and ongoing conflicts are not recreated.</p>';}
function diplomacy(action){const p=player(),n=current();if(p.id===n.id)return;const key=pair(p.id,n.id);if(p.war?.target===n.id&&action!=='sanction'){toast('Negotiate peace before opening diplomatic channels.');return}if(action==='improve'){if(!canSpend(p,8))return;spendCapital(p,8);setRelation(p.id,n.id,relation(p.id,n.id)+14);toast('Diplomatic outreach improved relations by 14.')}if(action==='trade'){if(!canSpend(p,15)||hasTreaty(p.id,n.id))return;if(relation(p.id,n.id)<25||Math.min(p.policies.trade,n.policies.trade)<40){toast('Agreement declined: improve relations and trade openness.');return}spendCapital(p,15);S.treaties.push(key);addEvent('Trade agreement signed',p.name+' and '+n.name+' open new markets. Output benefits build over time.','diplomacy');toast('Trade agreement signed.')}if(action==='sanction'){if(S.sanctions.includes(key)){S.sanctions=S.sanctions.filter(t=>t!==key);setRelation(p.id,n.id,relation(p.id,n.id)+10);toast('Sanctions lifted.')}else{if(!canSpend(p,10)){toast('You need 10 political capital.');return}spendCapital(p,10);S.sanctions.push(key);S.treaties=S.treaties.filter(t=>t!==key);setRelation(p.id,n.id,relation(p.id,n.id)-30);addEvent('Sanctions imposed',p.name+' restricts commerce with '+n.name+'. Both economies face disruption.','diplomacy');toast('Sanctions imposed.')}}render();requestDraw();}
function militaryPanel(n){const p=player();return '<div class="block"><h3>Defense & readiness</h3>'+metric('Annual defense budget',money(n.gdp*n.policies.defense/100))+metric('Defense share',n.policies.defense.toFixed(1)+'% of GDP')+metric('Equipment & logistics index',n.military.toFixed(0))+metric('Operational readiness',n.readiness.toFixed(0)+'%')+'<div class="bar"><div style="width:'+n.readiness+'%;background:var(--blue)"></div></div><p>Spending accumulates into military capability over years. Institutions improve delivery. War damages output, equipment and public support.</p></div>'+(n.war?'<div class="ideologybox"><div class="eyebrow">Active conflict</div><strong>'+nation(n.war.target).name+'</strong>'+metric('Duration',n.war.months+' months')+metric('Strategic balance',n.war.progress.toFixed(0))+'</div>'+(n.id===p.id||p.war?.target===n.id?'<button class="full" data-action="peace">Negotiate ceasefire</button>':''):n.id!==p.id?'<button class="danger full" data-action="war" '+(p.war?'disabled':'')+'>Consider military action</button>':'<p>No active conflict. Select another nation on the map to assess military action.</p>')+'<button class="full" data-action="policies">Change defense spending →</button><p class="note">Wars with a neighbour are fought on the land border the two countries actually share, and the front moves with the fighting. Beat an army decisively and you may impose terms or annex the country outright. No real conflicts are active at scenario start.</p>';}
function declareWar(){const a=player(),b=current();if(a.id===b.id||a.war||b.war){toast('One of these nations is already in a conflict.');return}if(!canSpend(a,25)){toast('Military action requires 25 political capital.');return}spendCapital(a,25);beginWarV13(a,b);a.approval-=12;a.stability-=5;setRelation(a.id,b.id,-95);S.treaties=S.treaties.filter(t=>t!==pair(a.id,b.id));addEvent('Conflict breaks out',a.name+' and '+b.name+' enter a conventional conflict. Output and civilian confidence fall.','warning');closeModal();render();requestDraw()}
function peace(){const a=player();if(!a.war)return;const b=nation(a.war.target);a.war=null;b.war=null;setRelation(a.id,b.id,-30);addEvent('Diplomacy ends the fighting',a.name+' and '+b.name+' agree to an immediate ceasefire. Recovery will take time.','diplomacy');toast('Ceasefire agreed.');render();requestDraw()}
function settingsPanel(){return '<h3>Sandbox rules</h3><p>Make the world as constrained or experimental as you like.</p><label class="toggleline">Other nations adjust their policies<input type="checkbox" data-option="ai" '+(S.options.ai?'checked':'')+'></label><label class="toggleline">Economic events and supply shocks<input type="checkbox" data-option="shocks" '+(S.options.shocks?'checked':'')+'></label><label class="toggleline">Infinite political capital<input type="checkbox" data-option="infiniteCapital" '+(S.options.infiniteCapital?'checked':'')+'></label><p>Unlimited political capital for reforms, diplomacy and military actions. Economic budgets, debt, and construction time still apply.</p><label class="toggleline">Free reforms only<input type="checkbox" data-option="freeReforms" '+(S.options.freeReforms?'checked':'')+'></label><div class="block"></div><h3>Your scenario</h3><button class="full" data-action="editScenario">Edit selected nation’s starting conditions</button><p>Directly change output, debt, stability and institutional capacity at any point.</p><div class="block"></div><h3>Save & resume</h3><button class="full" data-action="save">Save to this browser</button><button class="full" data-action="load">Load browser save</button><button class="full" data-action="export">Export save file</button><button class="full" data-action="import">Import save file</button><p>Saves stay on your device. Export a file for a portable backup.</p><button class="danger full" data-action="reset">Start a new world</button>';}

function showGuide(){modal('The Sovereign field guide','<p>Lead any nation in an open-ended geopolitical sandbox. There is no single victory condition: pursue prosperity, liberty, influence, equality, or a balance of your own.</p><h3>Your first five minutes</h3><ol><li>Select a nation on the map or in the nation selector. Choose <b>Play as</b> to take control.</li><li>Open <b>Policies</b>. Adjust targets or stage an ideology preset, review its budget, and enact a reform.</li><li>Press <b>▶</b> to run time, or <b>▸|</b> to advance one month. Watch approval, inflation, debt and growth.</li><li>Open <b>Diplomacy</b> and select another nation to improve relations, negotiate trade or impose sanctions.</li><li>Use <b>Sandbox</b> to change conditions, enable infinite political capital, save or reset the world.</li></ol><h3>Realism and its limits</h3><p>This is a <b>2026 sandbox with approximate, hand-authored starting conditions</b>. Country values and institutional scores are scenario assumptions, not a current statistical database. The 52 featured nations use rounded scenario estimates. Other nations use historical Natural Earth population and GDP fields, mostly from 2019, without updating them to 2026; their remaining settings are generic defaults. Each nation’s overview shows its data basis. Simulation coefficients are stylized game assumptions, not forecasts. The embedded map includes 174 country and territory outlines. Canada is playable through its map marker and nation selector; its outline is not included. Antarctica is outside the simulation. Some small states are absent at this map resolution. Disputed boundaries are cartographic representations, not statements of recognition.</p><p>Economic policy, civil liberties and electoral safeguards are separate dimensions. Presets describe simplified policy tendencies; they do not label a country’s population. Actual governments mix different approaches. Reform targets take 6–30 months to move about two-thirds toward their target, while productive benefits take years.</p><h3>How the model works</h3><p>Every tick is one month. Taxes finance services, transfers, investment, defense, administration and interest. Deficits add to debt; inflation reduces its real value. Very high debt triggers restructuring. Growth responds gradually to capital, institutions, taxes, trade, real interest rates and shocks. Civil liberties have their own value and influence support. Elections can renew or replace a government, while you remain in control of the nation.</p><p>AI governments adjust taxes and rates every six months. Conflicts are abstract and resolve through attrition, reparations or ceasefire, with no instant territorial conquest. Initial alliances, wars, supply chains, currencies, ethnic groups and military inventories are not reconstructed. Central-bank control is a sandbox simplification, including for currency unions.</p><h3>Personal taxes and public housing</h3><p>In Policies → Taxation, choose simple taxation, a flat income tax, progressive marginal brackets, or custom effective rates for four income groups. Under progressive taxation, only income within each bracket receives its rate. The first bracket can be tax-free. Custom group rates apply to a group’s whole income and can represent non-progressive experiments.</p><p>Four representative incomes and population weights are illustrative, with personal income totaling 65% of GDP. Tax revenue uses the weighted bills, and the inequality model uses after-tax income plus targeted transfers. Other taxes and contributions are a separate GDP share, so income taxes are not counted twice. Rates phase in over six months; a tax-system switch begins next month.</p><p>Mass public housing spends a chosen GDP share on new homes, with a 24-month construction pipeline and diminishing construction efficiency. Existing stock has annual upkeep of 0.035% of GDP per percentage point of housing need served, plus 1.2% annual deterioration. These are game coefficients. Rent assistance is less effective when supply is tight; permitting reform expands private supply gradually. Public transport and childcare are additional budget lines with delayed benefits. Housing stock, pipeline and effective renter burden appear under Economy and Society.</p><p>Sandbox → Infinite political capital removes all political-capital limits for the player without storing infinity as a number. Public budgets, debt, reform lags and physical construction limits remain active. Existing browser saves and exported version 1 saves migrate automatically.</p><h3>Programs, urbanization and debt relief</h3><p>Policies → Programs includes these original packages plus governance, research, and household-security reforms: mass urbanization, mass public housing, debt relief, a human-capital drive and the energy transition. Opening one shows its live state, its own sliders and a one-click button that stages the whole package as a draft reform. Nothing is committed until you enact it, and everything inside a program is still an ordinary policy you can move by hand.</p><p>Urbanization models three things at once. City building puts serviced land into an 18-month pipeline; the industrial drive and the rural-development budget set how strongly people are pulled toward cities; and upgrading, public housing and transport determine how much of that arrival the city can absorb. Migration beyond absorption capacity becomes informal settlement, which raises rents and inequality and cancels out the productivity gain a larger city would otherwise give. All coefficients are gameplay assumptions, not estimates of any real country.</p><p>V4 debt rules are described at the top of this guide and in the Debt relief program. The legacy monthly forced-default loop has been replaced by a sustained-stress review and a protection period.</p><h3>Current policy patterns</h3><table><tr><th>Example</th><th>Why a single ideology label falls short</th></tr><tr><td>Germany · 2025</td><td>Private investment incentives coexist with infrastructure spending, housing measures and social policy.</td></tr><tr><td>UK · Budget 2025</td><td>Public-service investment and asset-income tax changes coexist with borrowing constraints.</td></tr><tr><td>China · 2026 plan</td><td>Industrial strategy coexists with market reforms and the energy transition. Official targets are intentions, not observed outcomes.</td></tr></table><h3>Sources checked September 2026</h3><ul><li><a target="_blank" rel="noopener noreferrer" href="https://www.sipri.org/publications/2026/sipri-fact-sheets/trends-world-military-expenditure-2025">SIPRI: military expenditure in 2025</a> — defense budgets and fiscal tradeoffs.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.imf.org/en/publications/fm/issues/2026/04/15/fiscal-monitor-april-2026">IMF Fiscal Monitor, April 2026</a> — debt pressure and interest costs.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.imf.org/en/publications/fm/issues/2025/10/07/fiscal-monitor-october-2025">IMF Fiscal Monitor, October 2025</a> — spending composition, efficiency and delayed benefits.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.ecb.europa.eu/mopo/intro/transmission/html/index.en.html">ECB: monetary-policy transmission</a> — rates affect demand and inflation with uncertain lags.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.v-dem.net/documents/75/V-Dem_Institute_Democracy_Report_2026_lowres.pdf">V-Dem Democracy Report 2026</a> — institutions, democracy and liberties are distinct dimensions.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.bundesregierung.de/breg-en/news/a-start-has-been-made-2379544">German government policy overview</a>; <a target="_blank" rel="noopener noreferrer" href="https://www.gov.uk/government/publications/budget-2025-document/budget-2025-html">UK Budget 2025</a>; <a target="_blank" rel="noopener noreferrer" href="https://english.www.gov.cn/news/202603/13/content_WS69b4b144c6d00ca5f9a09dfd.html">China’s 2026 Government Work Report</a>.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.naturalearthdata.com/downloads/110m-cultural-vectors/110m-admin-0-countries/">Natural Earth</a> — public-domain geographical reference.</li></ul><p>Sources inform qualitative mechanisms, not calibrated country scores or the numerical strength of policy effects.</p><h3>Tax and housing references</h3><ul><li><a target="_blank" rel="noopener noreferrer" href="https://www.irs.gov/filing/federal-income-tax-rates-and-brackets">IRS: how marginal income-tax brackets work</a>.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.oecd.org/content/dam/oecd/en/publications/reports/2017/12/income-redistribution-through-taxes-and-transfers-across-oecd-countries_2342ea51/bc7569c6-en.pdf">OECD research: redistribution through taxes and transfers</a>.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.oecd.org/en/publications/restoring-public-finances_fbcf9161-en/full-report/housing_ce593155.html">OECD: housing supply, maintenance and allowances</a>.</li></ul><h3>Performance</h3><p>A single self-contained file, with no runtime downloads or libraries. Map paths are cached; the map redraws only when needed. Simulation runs monthly and pauses background computation when the tab is hidden. Histories and event logs are bounded.</p>');}

function diplomacyProblem(a,b,type){const d=DIPLOMACY[type];if(!d)return 'Unknown action.';if(a.id===b.id)return 'Select another nation.';if(type==='sanction'&&S.embargoes.some(e=>e.from===a.id&&e.to===b.id))return '';if(!canSpend(a,d.cost))return 'Requires '+d.cost+' political capital.';const wait=diplomaticLock(a.id,b.id,type);if(wait)return 'Available in '+wait+' months.';if(type!=='sanction'&&a.war?.target===b.id)return 'Negotiate peace before normal diplomacy.';if(PACT_TYPES.includes(type)&&agreement(a.id,b.id,type))return 'Already active.';if(PACT_TYPES.includes(type)&&S.sanctions.includes(pair(a.id,b.id)))return 'Resolve sanctions before signing agreements.';const requirement=d.min+(PACT_TYPES.includes(type)?Math.max(0,40-a.reputation)*.25:0);if(relation(a.id,b.id)<requirement)return 'Needs relations of at least '+Math.ceil(requirement)+' (including reputation).';if(type==='trade'&&Math.min(a.policies.trade,b.policies.trade)<40)return 'Both sides need trade openness of 40.';if(type==='research'&&Math.min(a.policies.services,b.policies.services)<8)return 'Both sides need services spending of 8% GDP.';if(type==='climate'&&Math.min(a.policies.climate,b.policies.climate)<40)return 'Both sides need transition effort of 40.';if(type==='mediate'&&(!b.war||b.war.target===a.id||relation(a.id,b.war.target)<0))return 'Partner must be in a third-party war; both belligerents must accept your role.';return '';}

function cityKey(name){return name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\bcity\b/g,'').replace(/[^a-z0-9]/g,'');}
function cityTemplate(n){const entry=CITY_CATALOG[n.id];if(!entry?.cities.length)throw Error('Missing city catalogue for '+n.id);const weights=entry.cities.map((_,i)=>1/Math.pow(i+2,.7)),sum=weights.reduce((a,b)=>a+b,0),coverage=weights.length===1?1:.75;return entry.cities.map((name,i)=>({id:n.id+'-'+i,name,share:weights[i]/sum*coverage,levels:Object.fromEntries(Object.keys(PROJECTS).map(k=>[k,0])),queue:[],management:{...LOCAL_DEFAULTS},crime:clamp(18+n.inequality*.4+n.slums*.15+i*1.5,10,75),satisfaction:60}));}
function upgradeNationV5(n){for(const k of ['policies','targets'])n[k]={...V5_DEFAULTS,...n[k]};const old=n.cities||[],used=new Set();n.cities=cityTemplate(n).map((c,i)=>{let previous=old.find(x=>!used.has(x)&&cityKey(x.name)===cityKey(c.name));if(!previous)previous=old.find(x=>!used.has(x)&&['Capital district','Regional center','Growth district'].includes(x.name));if(previous){used.add(previous);Object.assign(c.levels,previous.levels);c.queue=previous.queue.map(q=>({...q,paused:false}));}return c;});n.identity={mode:'national',flagId:n.id,pattern:'horizontal',colors:['#173d5c','#f4eee0','#b04444']};n.accounting={materialShare:clamp(.62-Math.log10(Math.max(500,n.gdp/n.pop*1000))*.04,.32,.6),depreciation:8};n.forces={army:n.military*.5,navy:n.military*.25,air:n.military*.25};n.doctrine='balanced';n.exports=0;n.imports=0;n.customs=0;n.tradeGrowth=0;n.cityOperating=0;n.cityRevenue=0;n.crime=40;n.citySatisfaction=60;}

function flagHtml(n){const id=n.identity;if(!id||id.mode==='national')return '<span class="flag">'+escapeHTML(CITY_CATALOG[n.id]?.flag||n.flag)+'</span>';if(id.mode==='country')return '<span class="flag">'+escapeHTML(CITY_CATALOG[id.flagId]?.flag||'🌐')+'</span>';const angle=id.pattern==='vertical'?'90deg':'180deg',colors=id.colors;return '<span class="customflag" role="img" aria-label="Custom three-color national flag" style="background:linear-gradient('+angle+','+colors[0]+' 0% 33.333%,'+colors[1]+' 33.333% 66.666%,'+colors[2]+' 66.666% 100%)"></span>';}

tickCities=function(n){let crime=0,satisfaction=0,shares=0;for(const c of n.cities){const q=activeProject(c);if(q){q.remaining--;if(q.remaining<=0){c.levels[q.type]++;c.queue=c.queue.filter(x=>x!==q);if(n.id===S.player)addEvent('City project completed',c.name+': '+PROJECTS[q.type].name+' is now operating.','development');}}const m=cityMetrics(n,c),local=c.management;const target=clamp(19+n.unemployment*.8+n.inequality*.35+(60-m.housing)*.15+(65-m.jobs)*.12+(100-n.capacity)*.08-local.police*.12-local.prevention*.15-n.policies.justice*.1-c.levels.police*1.5-c.levels.courts*2-c.levels.youth*2,3,95);c.crime+=(target-c.crime)/18;const support=clamp(30+m.quality*.3+m.health*.2+m.jobs*.15+(100-c.crime)*.15-local.tax*1.2,5,98);c.satisfaction+=(support-c.satisfaction)/12;crime+=c.crime*c.share;satisfaction+=c.satisfaction*c.share;shares+=c.share;n.human+=(m.education+m.health-100)*c.share*.0005;n.clean+=c.levels.solar*c.share*.015;n.rentBurden=clamp(n.rentBurden-c.levels.housing*c.share*.01,8,65);}n.crime=crime/shares;n.citySatisfaction=satisfaction/shares;n.approval=clamp(n.approval+(n.citySatisfaction-n.approval)*.003,5,95);if(S.options.ai&&n.id!==S.player&&S.month%12===0){const c=n.cities[Math.floor(S.month/12)%n.cities.length],keys=Object.keys(PROJECTS);startCityProject(n.id,c.id,keys[(Math.floor(S.month/12)+n.id.charCodeAt(0))%keys.length],true);}};

startCityProject=function(nid,cid,type,ai=false){const n=nation(nid),c=n?.cities.find(c=>c.id===cid),p=PROJECTS[type];if(!n||!c||!p||(!ai&&n.id!==S.player))return false;if(c.queue.length>=3||c.levels[type]+c.queue.filter(q=>q.type===type).length>=5){if(!ai)toast('The city queue is full, or this development has reached its five-level limit.');return false;}if(!canSpend(n,6)){if(!ai)toast('This project requires 6 political capital.');return false;}spendCapital(n,6);const duration=projectMonths(n,c,p);c.queue.push({type,duration,remaining:duration,cost:n.gdp*c.share*p.cost/100,paused:false});if(!ai){addEvent('City development approved',c.name+' queued '+p.name.toLowerCase()+'. One unpaused project is financed and built at a time.','development');renderPanel();renderStats();toast('Project added to the city queue.');}return true;};
function queueAction(action,index){const n=current(),c=n.cities[activeCity];if(n.id!==S.player||!Number.isInteger(index)||!c.queue[index])return;const q=c.queue[index];if(action==='pause')q.paused=!q.paused;if(action==='priority'){c.queue.splice(index,1);c.queue.unshift(q);}if(action==='cancel')c.queue.splice(index,1);renderPanel();toast(action==='cancel'?'Future project payments cancelled; past spending is not refunded.':'Construction queue updated.');}

function citiesV5Panel(n){activeCity=clamp(activeCity,0,n.cities.length-1);const c=n.cities[activeCity],m=cityMetrics(n,c),owned=n.id===S.player,entry=CITY_CATALOG[n.id];if(cityDraftId!==c.id){cityDraft={...c.management};cityDraftId=c.id;}const running=activeProject(c),budget=localBudget(c);return '<h3>Cities & local government</h3><label class="eyebrow" for="citySelect">'+n.cities.length+' named '+escapeHTML(entry.kind||'cities and settlements')+'</label><select class="full" id="citySelect">'+n.cities.map((x,i)=>'<option value="'+i+'" '+(i===activeCity?'selected':'')+'>'+escapeHTML(x.name)+' · crime '+x.crime.toFixed(0)+'</option>').join('')+'</select><div class="ideologybox" style="margin-top:18px"><div class="eyebrow">Municipal simulation</div><strong>'+escapeHTML(c.name)+'</strong>'+metric('Local output · GDP',money(n.gdp*c.share))+metric('Resident population · scenario',(n.pop*c.share).toFixed(3)+'M')+metric('Public satisfaction',c.satisfaction.toFixed(0)+' / 100')+'</div><div class="crimecard"><div class="eyebrow">Simulated crime pressure</div><strong>'+c.crime.toFixed(1)+' <small>/ 100</small></strong><span>'+crimeLabel(c.crime)+'</span><p>Higher is worse. This is a game index, not a measured crime rate or real-world ranking.</p></div><div class="previewgrid">'+Object.entries(m).map(([k,v])=>'<div class="minicard"><label>'+k[0].toUpperCase()+k.slice(1)+'</label><strong>'+v.toFixed(0)+'<small style="font-size:12px"> /100</small></strong></div>').join('')+'<details class="controlgroup" open><summary>Local management</summary><p>Local taxes and operating budgets are additional to national programs. Current local balance: '+pct(budget.revenue-budget.spending)+' of local GDP per year.</p>'+LOCAL_RULES.map(x=>'<div class="policy"><label class="metricrow" for="local-'+x.key+'"><span>'+x.name+'</span><output id="lo-'+x.key+'">'+cityDraft[x.key]+'</output></label><input type="range" id="local-'+x.key+'" data-local="'+x.key+'" min="'+x.min+'" max="'+x.max+'" step="'+x. function exportCapacity(n,good){const salt=[...n.id].reduce((a,c)=>a+c.charCodeAt(0),0),specialty=Object.keys(GOODS)[salt%4],factor=good===specialty?1.4:.75,industrial=good==='manufactures'?1+n.policies.industrial*.06:good==='technology'?1+n.policies.research*.08:1;return n.gdp*GOODS[good].capacity*factor*industrial/12;}
function tradeProblem(from,to,good,share){if(!from||!to||from.id===to.id||!GOODS[good])return 'Select two different countries and a valid commodity.';if(!Number.isFinite(share)||share<.25||share>5)return 'The contract must be 0.25–5% of exporter GDP per year.';if(from.war?.target===to.id||S.sanctions.includes(pair(from.id,to.id)))return 'War or sanctions block this trade route.';if(relation(from.id,to.id)<0)return 'Trade requires nonnegative bilateral relations.';if(Math.min(from.policies.trade,to.policies.trade)<20)return 'Both nations need trade openness of at least 20.';if(S.tradeDeals.some(d=>d.from===from.id&&d.to===to.id&&d.good===good))return 'This route already has a contract for that commodity.';if(S.tradeDeals.length>=1000)return 'The world trade-contract limit has been reached.';return '';}
function signTrade(partnerId,direction,good,share,ai=false,aiFrom=null){const a=ai?aiFrom:player(),b=nation(partnerId);if(!a||!b||!['export','import'].includes(direction))return false;const from=direction==='export'?a:b,to=direction==='export'?b:a,issue=tradeProblem(from,to,good,share);if(issue){if(!ai)toast(issue);return false;}if(!canSpend(a,10)){if(!ai)toast('A trade contract needs 10 political capital.');return false;}spendCapital(a,10);S.tradeDeals.push({id:S.nextTradeId++,from:from.id,to:to.id,good,share,expires:S.month+60});if(!ai){addEvent('Commodity contract signed',from.name+' will export '+GOODS[good].name.toLowerCase()+' to '+to.name+'. Deliveries start next month.','trade');renderPanel();renderStats();toast('Five-year trade contract signed.');}return true;}
function cancelTrade(id){const d=S.tradeDeals.find(d=>d.id===id);if(!d||![d.from,d.to].includes(S.player))return;S.tradeDeals=S.tradeDeals.filter(x=>x!==d);setRelation(d.from,d.to,relation(d.from,d.to)-3);renderPanel();toast('Future deliveries cancelled. Relations fall by 3.');}
function prepareTrade(){const expired=S.tradeDeals.filter(d=>d.expires<=S.month);S.tradeDeals=S.tradeDeals.filter(d=>d.expires>S.month);for(const d of expired)if([d.from,d.to].includes(S.player))addEvent('Trade contract expired',GOODS[d.good].name+' contract between '+nation(d.from).name+' and '+nation(d.to).name+' needs renewal.','trade');for(const n of S.nations){n.exports=0;n.imports=0;n.customs=0;n.tradeGrowth=0;}const requests=[],byExporter=new Map(),byImporter=new Map();for(const d of S.tradeDeals){const from=nation(d.from),to=nation(d.to);const blocked=from.war?.target===to.id||S.sanctions.includes(pair(from.id,to.id))||Math.min(from.policies.trade,to.policies.trade)<20;const tariff=hasTreaty(from.id,to.id)?0:to.policies.tariff/100,wanted=blocked?0:from.gdp*d.share/1200/(1+tariff),key=from.id+':'+d.good;requests.push({d,from,to,tariff,wanted,key,blocked});byExporter.set(key,(byExporter.get(key)||0)+wanted);byImporter.set(to.id,(byImporter.get(to.id)||0)+wanted);}S.tradeFlows=[];for(const r of requests){const exportLimit=exportCapacity(r.from,r.d.good),importLimit=r.to.gdp*.25/12,ratio=Math.min(1,exportLimit/Math.max(.0000001,byExporter.get(r.key)),importLimit/Math.max(.0000001,byImporter.get(r.to.id))),value=r.wanted*ratio,duty=value*r.tariff;r.from.exports+=value;r.to.imports+=value;r.to.customs+=duty;S.tradeFlows.push({id:r.d.id,value,duty,blocked:r.blocked});}for(const n of S.nations)n.tradeGrowth=clamp((n.exports+n.imports)/n.gdp*12*2,0,1.2);}
function tradeSummary(n){return '<div class="previewgrid"><div class="minicard"><label>Exports · last month</label><strong>'+money(n.exports)+'</strong></div><div class="minicard"><label>Imports · last month</label><strong>'+money(n.imports)+'</strong></div></div>'+metric('Trade balance · last month',money(n.exports-n.imports))+metric('Customs revenue · last month',money(n.customs))+'<p>Exports and imports are matched at the same pre-tariff value. Private export revenue does not become government money. Only customs duties enter the public budget.</p>';}
function tradePanel(){const a=player();if(!tradePartner||tradePartner===a.id||!nation(tradePartner))tradePartner=selected!==a.id?selected:S.nations.find(n=>n.id!==a.id).id;const deals=S.tradeDeals.filter(d=>[d.from,d.to].includes(a.id));return '<h3>International commodity trade</h3><div id="tradeSummary">'+tradeSummary(a)+'</div><label class="eyebrow" for="tradePartner">Partner nation</label><select class="full" id="tradePartner">'+S.nations.filter(n=>n.id!==a.id).sort((a,b)=>a.name.localeCompare(b.name)).map(n=>'<option value="'+n.id+'" '+(n.id===tradePartner?'selected':'')+'>'+escapeHTML(n.name)+'</option>').join('')+'</select><div class="previewgrid"><label>Direction<select class="full" id="tradeDirection"><option value="export">Export to partner</option><option value="import">Import from partner</option></select></label><label>Commodity<select class="full" id="tradeGood">'+Object.entries(GOODS).map(([k,g])=>'<option value="'+k+'">'+g.name+'</option>').join('')+'</select></label></div><label class="metricrow" for="tradeShare"><span>Annual size · % exporter GDP</span><input id="tradeShare" type="number" min=".25" max="5" step=".25" value="1"></label><button class="primary full" id="signTrade">Sign five-year contract · 10 capital</button><p>Contracts require nonnegative relations, openness of at least 20, and no bilateral war or sanctions. Deliveries are capped by exporter capacity and importer demand, and tariffs reduce trade. Free-trade agreements waive tariffs.</p><h3>Active contracts · '+deals.length+'</h3>'+(deals.length?deals.map(d=>{const flow=S.tradeFlows.find(f=>f.id===d.id);return '<div class="projectcard"><div class="eyebrow">'+GOODS[d.good].name+'</div><strong>'+escapeHTML(nation(d.from).name)+' → '+escapeHTML(nation(d.to).name)+'</strong>'+metric('Annual contract target',d.share+'% exporter GDP')+metric('Last month delivered',flow?money(flow.value):'Starts next month')+metric('Status',flow?.blocked?'Suspended by restrictions':'Trading / awaiting next m const v4FiscalV5=fiscal;
fiscal=function(n,p=n.policies){const b=v4FiscalV5(n,p),eff=.75+n.capacity*.0025;const corporate=p.corporateSurcharge*.2*eff,local=n.cityRevenue||0,customs=p.tariff===n.policies.tariff?(n.customs||0)/n.gdp*1200:(n.customs||0)/Math.max(.000001,n.policies.tariff)*p.tariff/n.gdp*1200;const additionalSpend=(n.cityOperating||0)+p.publicEmployment+p.smeCredit+p.justice*.008+p.competition*.003+p.mobilization*.015;b.revenue+=corporate+local+customs;b.spending+=additionalSpend;b.balance=b.revenue-b.spending-b.debtService;b.v5Revenue={corporate,local,customs};b.v5Spending=additionalSpend;return b;};

showGuide=function(){v4GuideV5();$('modalContent').insertAdjacentHTML('afterbegin','<div class="block"><h3>Sovereign V5 · Cities, safety & trade</h3><p>All 193 UN member states, both observer states, and the existing territories have real named settlements or districts. Small added states use map markers. Place names are geographical references; local output, population, crime and service indices are game assumptions. Some entries are villages, quarters or research stations rather than separate cities.</p><p><b>Local government:</b> set police, prevention, services, maintenance, density and tax supplements. Crime reacts over time to employment, housing, justice and prevention. Queues hold three projects, with one unpaused project building at a time. Pause, prioritize or cancel future work. Infrastructure needs recurring upkeep.</p><p><b>Trade:</b> create food, energy, manufactured-goods and technology contracts. Each delivery creates identical pre-tariff exports and imports. Commodity and demand limits prevent overselling; sanctions and war suspend routes. Tariffs are government revenue, while private export sales are not. National production profiles are scenario assumptions.</p><p><b>Military:</b> distribute the existing defense budget across army, navy and air forces. The shares must total 100%. Training and logistics improve capability while leaving fewer resources for equipment. Mobilization adds spending and reduces civilian output. Doctrine affects the abstract war model; no nuclear forces are modeled.</p><p><b>GDP and NMP:</b> the Economy selector reports GDP or an approximate Net Material Product: GDP × material-production share × (1 − material depreciation). It includes modeled material distribution services but omits most nonmaterial services and historical accounting adjustments. Changing the display never creates money or changes GDP, debt or tax bases.</p><p><b>Speed and flags:</b> 1× defaults to eight seconds per month. Change timing or choose a national/custom flag in Sandbox. V1–V4 saves migrate; named-city projects are preserved, including when place spelling has changed.</p><p>References: <a target="_blank" rel="noopener noreferrer" href="https://www.elibrary.imf.org/display/book/9781557753045/ch02.xml">IMF explanation of Net Material Product, Box 1</a>; <a target="_blank" rel="noopener noreferrer" href="https://www.oecd.org/en/data/indicators/nominal-gross-domestic-product-gdp.html">OECD GDP definition</a>; <a target="_blank" rel="noopener noreferrer" href="https://tradecosts.wto.org/">WTO trade costs</a>; <a target="_blank" rel="noopener noreferrer" href="https://www.unodc.org/documents/data-and-analysis/Crime-statistics/Manual_on_Victimization_surveys_2009_web.pdf">UNODC crime measurement guidance</a>. These inform concepts, not calibrated game coefficients.</p></div>');};

// V5 macro layer — central bank, production-function growth, demographics and domestic policy.
// Every coefficient below is a gameplay assumption, not an estimated parameter. Named concepts
// (Taylor rule, Okun's law, conditional convergence, NAIRU) are simplified to one-line proxies.
const ALPHA=.33,WORLD_FRONTIER=105;// capital share; frontier output per person in $k

];

{key:'pensionAge',name:'Statutory pension age',min:58,max:72,step:1,unit:'years',group:'Domestic policy',desc:'A later pension age raises participation and cuts pension cost, and is unpopular. Effects appear over years.'},

{key:'sovereignFund',name:'Sovereign fund contribution',min:0,max:5,step:.25,unit:'% GDP',desc:'Saves budget resources into a fund that cushions shocks and earns a modeled return.'}

const V5_MACRO_DEFAULTS={inflationTarget:2,cbIndependence:60,reserveRequirement:8,assetPurchases:0,macroprudential:45,pensionAge:65,familyBenefit:.6,vocational:40,activeLabor:35,regionalFunds:.4,digitalGov:40,landTax:.8,sovereignFund:0};
POLICY.push(...V5_MONETARY,...V5_DOMESTIC);Object.assign(EXTRA_DEFAULTS,V5_MACRO_DEFAULTS);
for(const p of Object.values(PRESETS))Object.assign(p,V5_MACRO_DEFAULTS);

// ---------- national accounts state ----------
function econSeed(n){
 const p=n.policies,perCapita=n.gdp/Math.max(.01,n.pop);// $bn per million people = $k per person
 n.participation=clamp(.415+(n.human-50)*.002+p.services*.004+p.childcare*.006-(70-p.pensionAge)*.006,.32,.7);
 n.employment=n.pop*n.participation*(1-n.unemployment/100);
 n.capitalRatio=clamp(2.1+Math.log10(Math.max(1,perCapita))*.85+(n.infra-50)*.006,1.6,4.2);
 n.capitalStock=n.gdp*n.capitalRatio;
 n.tfp=n.gdp/(Math.pow(n.capitalStock,ALPHA)*Math.pow(Math.max(.01,n.employment),1-ALPHA));
 n.tfpBase=n.tfp;n.potentialGdp=n.gdp;n.outputGap=0;n.investShare=.22;
 n.nairuBase=clamp(n.unemployment,2.8,24);n.nairu=n.nairuBase;n.priceLevel=100;n.fund=0;n.reer=100;
 n.currentAccount=0;n.fertility=clamp(5.3-Math.log10(Math.max(.3,perCapita))*1.95-(n.human-55)*.02+p.familyBenefit*.12,1.2,6.6);
 n.potentialGrowth=clamp(n.growth,-8,10);
 // Opening split of the seeded growth rate, replaced by measured accounting after one month.
 n.decomposition={capital:n.potentialGrowth*.4,labour:n.potentialGrowth*.2,tfp:n.potentialGrowth*.4};n.tfpGrowth=1;n.popGrowth=.004;n.lastBalance=0;
 n.mon={expected:n.inflation,credibility:clamp(30+n.capacity*.55+p.cbIndependence*.12,15,92),balance:0,rate:p.rate,neutral:2,taylor:p.rate,spread:1.6};
}
function upgradeNationEconV5(n){
 for(const k of ['policies','targets'])n[k]={...V5_MACRO_DEFAULTS,...n[k]};
 if(!n.mon||!Number.isFinite(n.capitalStock))econSeed(n);
 if(!Number.isFinite(n.nairuBase))n.nairuBase=clamp(n.unemployment,2.8,24);
 if(!Number.isFinite(n.gapTarget))n.gapTarget=n.outputGap||0;
 n.policies.inflationTarget=clamp(n.policies.inflationTarget,0,8);n.targets.inflationTarget=clamp(n.targets.inflationTarget,0,8);
 if(!FX_REGIMES[n.fxRegime])n.fxRegime=n.capacity>62?'float':'managed';
}
// Global conditions every nation reacts to. Small countries take world rates as given.
let worldRate=2.6,worldInflation=2.4,worldGrowth=2.5;
function refreshWorld(){
 let r=0,i=0,g=0,w=0;
 for(const n of S.nations){const size=Math.sqrt(n.gdp);r+=(n.mon?.rate??n.policies.rate)*size;i+=n.inflation*size;g+=n.growth*size;w+=size;}
 worldRate=r/Math.max(1,w);worldInflation=i/Math.max(1,w);worldGrowth=g/Math.max(1,w);
}

// ---------- monetary policy ----------
function neutralRate(n){return clamp(.3+n.potentialGrowth*.5-(n.mon.balance)*.012-Math.max(0,n.policies.capitalControls-40)*.006,-1.5,6);}
function taylorRate(n){const p=n.policies,target=p.inflationTarget;
 return clamp(n.mon.neutral+n.inflation+.5*(n.inflation-target)+.5*n.outputGap,-.5,25);}
function effectiveRate(n){return n.mon?n.mon.rate:n.policies.rate;}
function expectedInflation(n){return n.mon?n.mon.expected:n.inflation;}
function lendingSpread(n){const p=n.policies,debtRatio=n.debt/n.gdp*100;
 // Balance-sheet support has diminishing returns past roughly 25% of GDP.
 const qe=Math.sign(n.mon.balance)*Math.sqrt(Math.abs(n.mon.balance))*.22;
 return clamp(1.1+p.reserveRequirement*.055+p.macroprudential*.009-qe+Math.max(0,debtRatio-90)*.011+Math.max(0,55-n.mon.credibility)*.02-n.capacity*.008,.2,12);}
function tickMonetary(n){
 const p=n.policies,m=n.mon,target=p.inflationTarget;
 m.neutral=neutralRate(n);m.taylor=taylorRate(n);
 const indep=p.cbIndependence/100;
 let desired=indep*m.taylor+(1-indep)*p.rate;
 // A peg imports the world policy rate and surrenders most monetary autonomy.
 if(n.fxRegime==='peg')desired=worldRate*.8+desired*.2;else if(n.fxRegime==='managed')desired=worldRate*.35+desired*.65;
 m.rate+=(clamp(desired,-.5,25)-m.rate)/2.5;
 m.spread=lendingSpread(n);
 m.balance=clamp(m.balance+p.assetPurchases/12,-8,60);
 // Expectations anchor on the target in proportion to credibility.
 const anchor=m.credibility/100*target+(1-m.credibility/100)*n.inflation;
 m.expected+=(anchor-m.expected)/9;
 const miss=Math.abs(n.inflation-target);
 m.credibility=clamp(m.credibility+(miss<1.2?.22:-Math.min(miss,8)*.05)+(indep-.5)*.09+(n.capacity-55)*.004-Math.max(0,m.balance-25)*.006,5,97);
 // Real exchange rate: floats correct, pegs accumulate misalignment.
 const drift=(n.inflation-worldInflation)*.09+(worldRate-m.rate)*.05;
 if(n.fxRegime==='peg')n.reer=clamp(n.reer+drift,55,190);
 else n.reer=clamp(n.reer+drift*(n.fxRegime==='managed'?.55:.3)+(100-n.reer)/(n.fxRegime==='float'?26:60),55,190);
}
// ---------- supply side ----------
function tickSupply(n){
 const p=n.policies,perCapita=n.gdp/Math.max(.01,n.pop);
 // Demographics: fertility, ageing and migration instead of one global growth rate.
 const targetFert=clamp(5.3-Math.log10(Math.max(.3,perCapita))*1.95-(n.human-55)*.02+p.familyBenefit*.12+p.childcare*.015,1.2,6.6);
 n.fertility+=(targetFert-n.fertility)/180;
 // Annual rates: fertility above replacement adds people, ageing societies shrink, policy moves migration.
 const natural=(n.fertility-2.08)*.006,migration=(p.immigration-50)*.00006+(perCapita>25?.0015:0);
 n.popGrowth=clamp(natural+migration,-.008,.032);n.pop=Math.max(.001,n.pop*(1+n.popGrowth/12));
 const partTarget=clamp(.415+(n.human-50)*.002+p.services*.004+p.childcare*.006+p.familyBenefit*.012-(70-p.pensionAge)*.006+(p.activeLabor-35)*.0012+(p.vocational-40)*.0008+(p.liberties-50)*.0006-Math.max(0,p.labor-80)*.001-Math.max(0,n.unemployment-12)*.004,.32,.72);
 n.participation+=(partTarget-n.participation)/60;
 // Structural unemployment floor, then Okun's law around it.
 n.nairu+=(clamp(n.nairuBase+Math.max(0,p.labor-70)*.05+Math.max(0,p.minimumWage-65)*.03-(p.activeLabor-35)*.02-(p.vocational-40)*.015-(p.business-50)*.008+(n.inequality-40)*.03+(n.crime-40)*.015,2,26)-n.nairu)/36;
 n.employment=n.pop*n.participation*(1-n.unemployment/100);
 // Investment: public capital plus a private response to real lending rates and conditions.
 const realLending=effectiveRate(n)+n.mon.spread-expectedInflation(n);
 const privateInvest=clamp(17.5-realLending*.7+(p.business-50)*.045+p.competition*.02+p.smeCredit*1.1+(n.mon.credibility-50)*.03-p.capitalControls*.025-p.macroprudential*.012-(n.war?4:0)-Math.max(0,n.debt/n.gdp*100-110)*.02,3,34);
 const publicInvest=p.investment+p.transit*.6+p.urbanization+p.regionalFunds*.7;
 n.investShare+=((privateInvest+publicInvest)/100-n.investShare)/9;
 const depreciation=clamp(.045+(50-n.infra)*.0002,.032,.068);
 const oldCapital=n.capitalStock;
 n.capitalStock=clamp(n.capitalStock+(n.investShare*n.gdp-depreciation*n.capitalStock)/12,n.gdp*1.2,n.gdp*6);
 n.capitalRatio=n.capitalStock/Math.max(.001,n.gdp);
 // Conditional convergence: catching up needs institutions, openness and schooling.
 const quality=clamp((n.capacity*.42+p.institutions*.25+n.human*.15+p.trade*.18)/100,.12,1);
 const gap=clamp(Math.log(worldFrontier()/Math.max(.4,perCapita)),0,3.2);
 const sanctions=S.sanctions.filter(t=>t.split(':').includes(n.id)).length;
 const tfpGrowth=clamp(.75+gap*.8*quality+(p.research-1.5)*.09+(p.vocational-40)*.006+(p.digitalGov-40)*.005+(p.competition-50)*.005+(p.trade-55)*.005+(p.antiCorruption-55)*.005+n.tradeGrowth*.35-sanctions*.45-(n.war?1.4:0)-Math.max(0,n.crime-55)*.012-Math.max(0,p.tax-42)*.022,-3.5,7.5);
 n.tfp*=Math.pow(1+tfpGrowth/100,1/12);
 const oldPotential=n.potentialGdp;
 n.potentialGdp=n.tfp*Math.pow(n.capitalStock,ALPHA)*Math.pow(Math.max(.005,n.pop*n.participation*(1-n.nairu/100)),1-ALPHA);
 n.potentialGrowth=clamp((Math.pow(n.potentialGdp/Math.max(.001,oldPotential),12)-1)*100,-12,14);
 const capitalGrowth=clamp((Math.pow(Math.max(1e-9,n.capitalStock)/Math.max(1e-9,oldCapital),12)-1)*100,-25,25);
 // Labour is the residual, so the three components always sum to potential growth.
 n.decomposition={capital:ALPHA*capitalGrowth,labour:n.potentialGrowth-ALPHA*capitalGrowth-tfpGrowth,tfp:tfpGrowth};
 n.tfpGrowth=tfpGrowth;
}
// ---------- demand, prices and the output gap ----------
function macroV5(n,budget,legacyPotential,realRate,shock,warCost,sanctionCount,tradeCount){
 const p=n.policies,m=n.mon,oldGDP=n.gdp;
 tickMonetary(n);tickSupply(n);
 const monetaryGap=-(effectiveRate(n)-expectedInflation(n)-m.neutral)*(n.fxRegime==='peg'?.75:.55);
 const fiscalImpulse=clamp(-(budget.balance-(n.lastBalance??budget.balance))*.22,-2.2,2.2);
 n.lastBalance=budget.balance;
 const competitiveness=(100-n.reer)*.035;
 const target=clamp(monetaryGap+fiscalImpulse+competitiveness+n.tradeGrowth*.5+p.publicEmployment*.35+p.smeCredit*.25-shock*1.15-warCost*.9-sanctionCount*.5+Math.min(tradeCount,5)*.1+(m.credibility-50)*.006+(clamp(legacyPotential,-12,10)-2.5)*.14-Math.max(0,n.inflation-10)*.11,-9,7);
 n.gapTarget+=(target-n.gapTarget)/7;
 const closing=clamp(n.gapTarget-n.outputGap,-9,9)/5;
 n.gdp=Math.max(.02,n.gdp*(1+n.potentialGrowth/1200)*(1+closing/100));
 n.outputGap=clamp((n.gdp/Math.max(.0001,n.potentialGdp)-1)*100,-16,14);
 n.growth+=((Math.pow(n.gdp/oldGDP,12)-1)*100-n.growth)/3;
 n.growth=clamp(n.growth,-28,22);
 // Expectations-augmented Phillips curve with import-price and tariff pass-through.
 const passThrough=(p.tariff*.035+Math.max(0,n.reer-100)*.02*(n.fxRegime==='peg'?.4:1))*(1-p.capitalControls*.002);
 const wanted2=expectedInflation(n)+n.outputGap*.42+passThrough-shock*.75+warCost*.55+Math.max(0,-budget.balance-6)*.09+Math.max(0,m.balance-20)*.015;
 n.inflation+=(clamp(wanted2,-3.5,90)-n.inflation)/6;
 n.priceLevel=Math.max(1,n.priceLevel*Math.pow(1+n.inflation/100,1/12));
 // Sovereign fund and external balance.
 n.fund=Math.max(0,n.fund+(p.sovereignFund*n.gdp/100)/12+n.fund*.035/12);
 n.currentAccount+=(clamp((n.exports-n.imports)/Math.max(.01,n.gdp)*100+competitiveness*.4-n.investShare*12+(n.mon.credibility-50)*.02,-14,14)-n.currentAccount)/12;
}
// Unemployment is set by Okun's law around the structural floor, replacing the v4 rule.
function unemploymentV5(n){
 const p=n.policies,okun=clamp(n.nairu-.45*n.outputGap-p.publicEmployment*.35-p.smeCredit*.15,1.2,32);
 n.unemployment+=(okun-n.unemployment)/9;n.unemployment=clamp(n.unemployment,1.2,34);
}

const v4FiscalEcon=fiscal;
fiscal=function(n,p=n.policies){
 const b=v4FiscalEcon(n,p),eff=.75+n.capacity*.0025;
 const land=p.landTax*eff,pension=Math.max(0,(67-p.pensionAge))*.3,
  domestic=p.familyBenefit+p.vocational*.006+p.activeLabor*.007+p.regionalFunds+p.digitalGov*.004+p.sovereignFund;
 b.revenue+=land;b.spending+=pension+domestic;
 // Central-bank asset purchases are not budget revenue; only the interest channel is modelled.
 if(n.mon)b.interest=clamp(b.interest+(effectiveRate(n)-n.policies.rate)*.55+n.mon.spread*.18-Math.max(0,n.mon.credibility-60)*.006,.2,14),b.debtService=n.debt/n.gdp*b.interest;
 b.balance=b.revenue-b.spending-b.debtService;
 b.econRevenue={land};b.econSpending={pension,domestic};
 return b;};

// V6: difficulty modes and an optional world without national debt.
// Difficulty is a bundle of sandbox rules, not a hidden multiplier on the economy.
// Every setting a mode applies stays visible and individually editable in Sandbox.
const DIFFICULTY={
 easy:{name:'Easy',tag:'Debt-free world',
  blurb:'National debt is switched off entirely, supply shocks are rare and mild, political capital rebuilds quickly and reforms are cheap. Build without a fiscal ceiling.',
  rules:{noDebt:true,forgivingDebt:true,shocks:false,shockScale:.6,shockEvery:7,ai:true,aiAggression:.5,capitalRate:1.5,reformScale:.7}},
 medium:{name:'Medium',tag:'Balanced',
  blurb:'Debt returns under the forgiving carrying rules, shocks arrive on the normal cycle, and political capital and reform costs are unmodified. The V5 experience.',
  rules:{noDebt:false,forgivingDebt:true,shocks:true,shockScale:1,shockEvery:5,ai:true,aiAggression:1,capitalRate:1,reformScale:1}},
 hard:{name:'Hard',tag:'Standard carrying costs',
  blurb:'Full debt interest with V3 carrying costs, frequent and severe shocks, assertive rivals, slow political capital and expensive reforms. Every choice has to be paid for.',
  rules:{noDebt:false,forgivingDebt:false,shocks:true,shockScale:1.5,shockEvery:3,ai:true,aiAggression:1.6,capitalRate:.7,reformScale:1.35}}};
const V6_DEFAULTS={difficulty:'easy',...DIFFICULTY.easy.rules};
function difficultyOf(){return DIFFICULTY[S?.options?.difficulty]?S.options.difficulty:'easy';}
// A save whose rules have been edited by hand no longer matches the mode that created it.
function rulesMatch(key){const d=DIFFICULTY[key];return !!d&&Object.entries(d.rules).every(([k,v])=>S.options[k]===v);}
function difficultyLabel(){const key=difficultyOf();return DIFFICULTY[key].name+(rulesMatch(key)?'':' · customised');}
function applyDifficulty(key,quiet=false){
 if(!DIFFICULTY[key])return false;
 S.options.difficulty=key;Object.assign(S.options,DIFFICULTY[key].rules);
 if(S.options.noDebt)for(const n of S.nations){n.debt=0;n.crisisMonths=0;n.crisisGrace=0;n.debtWarned=0;}
 if(!quiet){addEvent('Difficulty set',DIFFICULTY[key].name+' rules are in force. '+DIFFICULTY[key].blurb,'model');renderStats();renderPanel();}
 return true;}
const numericOption=(k,fallback)=>Number.isFinite(S?.options?.[k])?S.options[k]:fallback;

// ---------- a world without national debt ----------
function debtDisabled(){return S?.options?.noDebt===true;}
// Replaces the V5 debt accumulation line. With debt off, deficits are simply not financed by
// borrowing: no stock builds up, so nothing later charges interest or triggers a restructuring.
function accrueDebtV6(n,budget,oldGDP){
 if(debtDisabled()){n.debt=0;n.crisisMonths=0;n.debtWarned=0;return;}
 n.debt=Math.max(0,(n.debt*(1+budget.interest/1200)+(budget.spending-budget.revenue)*oldGDP/1200)/(1+n.inflation/1200));}
const v5HandleDebtV6=handleDebtV4;

const v5FiscalV6=fiscal;
fiscal=function(n,p=n.policies){
 const b=v5FiscalV6(n,p);
 if(!debtDisabled())return b;
 b.interest=0;b.debtService=0;b.debtRatio=0;
 b.balance=b.revenue-b.spending;
 return b;};

const v5TickDiplomacyV6=tickDiplomacy;
tickDiplomacy=function(){
 v5TickDiplomacyV6();
 if(!S.options.ai)return;
 const aggression=numericOption('aiAggression',1);
 // Below 1 the world is friendlier: rivals actively court each other and the player.
 if(aggression<1&&S.month%3===0){
  const warmth=(1-aggression)*.6;
  for(const p of S.agreements)setRelation(p.a,p.b,relation(p.a,p.b)+warmth);
  const pool=S.nations.filter(n=>!n.war);
  if(pool.length>1){const a=pool[Math.floor(random()*pool.length)],b=pool[Math.floor(random()*pool.length)];
   if(a.id!==b.id&&!S.sanctions.includes(pair(a.id,b.id)))setRelation(a.id,b.id,relation(a.id,b.id)+warmth*4);}
  return;}
 // Above 1 rivals turn on each other, and on a player they already dislike. Relations gate this,
 // so diplomacy can still prevent it, and no AI nation declares war unprompted in any mode.
 if(aggression<=1||S.month%9!==0)return;
 const pool=S.nations.filter(n=>n.id!==S.player&&!n.war);
 if(pool.length<2)return;

function applyEra(key){
 const e=ERAS[key];if(!e)return false;
 S.options.era=key;S.startYear=e.year;S.startMonth=e.month;
 const scaleP=(n,k,f)=>{if(typeof f!=='number')return;
  const v=f<=1&&f>0&&n.policies[k]>1?n.policies[k]*f:f;
  const spec=POLICY.find(x=>x.key===k);
  n.policies[k]=n.targets[k]=spec?clamp(v,spec.min,spec.max):v;};
 for(const n of S.nations){
  n.pop=Math.max(.001,n.pop*e.popScale);
  n.gdp=Math.max(.02,n.gdp*e.gdpScale);
  n.debt=n.debt*e.gdpScale;
  n.inflation=clamp(n.inflation+e.inflation,-2,90);
  if(e.rate)n.policies.rate=n.targets.rate=clamp(e.rate+(n.inflation-4)*.35,0,20);
  for(const[k,f]of Object.entries(e.policy))scaleP(n,k,f);
  for(const[k,f]of Object.entries(e.state))n[k]=clamp(n[k]*f,0,100);
  if(e.fx)n.fxRegime=e.fx;
  econSeed(n);upgradeNationEconV5(n);
  n.mon.rate=n.policies.rate;n.mon.expected=n.inflation;
  n.mon.credibility=clamp(n.mon.credibility*(key==='e1970'?.55:key==='e1985'?.75:key==='e2000'?.95:1),5,97);
 }
 refreshWorld();
 return true;}

// A peg anchors to a reserve currency, not to the average of everyone including itself. Deriving
// the world rate from every nation made a universally pegged era (1970) self-referential: each
// bank followed an average it was itself setting, so rates never fell and investment collapsed.
// Floating economies set the anchor; pegs follow it.
refreshWorld=function(){
 let r=0,i=0,g=0,w=0,fr=0,fw=0;
 for(const n of S.nations){
  const size=Math.sqrt(n.gdp),rate=n.mon?.rate??n.policies.rate;
  r+=rate*size;i+=n.inflation*size;g+=n.growth*size;w+=size;
  if(n.fxRegime==='float'){fr+=rate*size;fw+=size;}}
 worldInflation=i/Math.max(1,w);worldGrowth=g/Math.max(1,w);
 // With no floating anchor at all, fall back to the reaction function rather than the average.
 if(fw>w*.08){worldRate=fr/fw;return;}
 let t=0,tw=0;
 for(const n of S.nations){if(!n.mon)continue;const size=Math.sqrt(n.gdp);t+=taylorRate(n)*size;tw+=size;}
 worldRate=tw?t/tw:r/Math.max(1,w);};

// Which present-day polygon each historical entity controls. Built when an era is applied.
function territoryOwner(polyId){return S?.territory?.[polyId]??polyId;}

function buildTerritory(){
 S.territory={};
 const live=new Set(S.nations.map(n=>n.id));
 for(const[id,info]of Object.entries(S.historical||{}))
  for(const m of info.members)if(GEO.some(g=>g.id===m))S.territory[m]=id;
 // A polygon whose country is absent this era belongs to nobody and renders as open land.
 for(const g of GEO)if(!S.territory[g.id]&&!live.has(g.id))S.territory[g.id]='';
}

  if((op===aId&&oq===bId)||(op===bId&&oq===aId))points.push(...pts);}
 return points;}
function shareBorder(aId,bId){return frontSector(aId,bId).length>=2;}

function committedForce(n,attacking){
 const p=n.policies,w=n.war;
 const doctrine=DOCTRINE_WAR[n.doctrine]||DOCTRINE_WAR.balanced;
 const share=w?w.commitment:.6;
 const quality=.55+p.training*.0035+p.logistics*.002;
 const posture=attacking?doctrine.attack:doctrine.defend;
 return Math.max(.01,n.forces.army*share*(n.readiness/100)*quality*posture*(w?w.supply:1));}

// Supply degrades the further a front is pushed beyond its own border, so an advance culminates.
function supplyFor(n,line){
 const beyond=Math.max(0,line);
 return clamp(1-beyond*(.85-n.policies.logistics*.004),.25,1);}

function openFrontV11(a,b){
 const sector=frontSector(a.id,b.id),land=sector.length>=2;
 for(const[self,other,attacking]of [[a,b,true],[b,a,false]]){
  self.war={target:other.id,months:0,progress:0,
   land,attacker:attacking,line:0,commitment:.6,supply:1,
   casualties:0,intensity:0,sector:attacking?sector:[]};}
 return land;}

function battleV11(a,b){
 // a is always the attacker's record holder for the shared front position.
 const land=a.war.land;
 a.war.supply=supplyFor(a,a.war.line);
 b.war.supply=supplyFor(b,-a.war.line);
 const pa=committedForce(a,true),pb=committedForce(b,false);
 const odds=pa/(pa+pb);
 const intensity=clamp((a.war.commitment+b.war.commitment)/2,.1,1);
 if(land){
  const push=(odds-.5)*2*intensity*.09+(random()-.5)*.03;
  a.war.line=clamp(a.war.line+push,-1,1);
  b.war.line=-a.war.line;}
 else{
  // A limited war grinds both sides down without a front to move.
  a.war.line=clamp(a.war.line+(odds-.5)*.02,-.4,.4);
  b.war.line=-a.war.line;}
 a.war.progress=a.war.line*100;b.war.progress=-a.war.progress;
 a.war.intensity=b.war.intensity=intensity;
 // Losses fall on the committed army first, then on the wider force.
 for(const[self,power,enemy]of [[a,pa,pb],[b,pb,pa]]){
  const doctrine=DOCTRINE_WAR[self.doctrine]||DOCTRINE_WAR.balanced;
  const rate=clamp(.012*intensity*doctrine.attrition*(enemy/Math.max(.01,power))*(land?1:.55),0,.09);
  const lost=self.forces.army*rate;
  self.forces.army=Math.max(.01,self.forces.army-lost);
  self.forces.navy=Math.max(.01,self.forces.navy*(1-rate*.35));
  self.forces.air=Math.max(.01,self.forces.air*(1-rate*.55));
  self.military=self.forces.army+self.forces.navy+self.forces.air;
  self.war.casualties+=lost;
  self.readiness=clamp(self.readiness-intensity*1.6+self.policies.logistics*.02,15,95);
  self.stability=clamp(self.stability-intensity*.5,3,97);}
}

// ---------- war resolution ----------
resolveWars=function(){
 const done=new Set();
 for(const first of S.nations){
  if(!first.war||done.has(first.id))continue;
  const other=nation(first.war.target);
  if(!other||!other.war){first.war=null;continue;}
  done.add(first.id);done.add(other.id);
  const a=first.war.attacker?first:other,b=a===first?other:first;
  a.war.months++;b.war.months++;
  battleV11(a,b);
  // Fighting damages the economy where the front is, in proportion to the intensity.
  for(const[self,exposure]of [[a,Math.max(0,-a.war.line)],[b,Math.max(0,a.war.line)]]){
   const harm=a.war.intensity*(.35+exposure*1.6);
   self.gdp=Math.max(.02,self.gdp*(1-harm*.0016));
   self.approval=clamp(self.approval-harm*.35,3,97);
   for(const c of self.cities)c.crime=clamp(c.crime+harm*.25,0,100);}
  const overrun=Math.abs(a.war.line)>=.995,exhausted=a.war.months>=48,
   collapsed=a.forces.army<.02||b.forces.army<.02;
  if(overrun||exhausted||collapsed){
   const winner=a.war.line>0?a:a.war.line<0?b:(a.military>=b.military?a:b),loser=winner===a?b:a;
   const decisive=overrun||collapsed;
   const reparations=Math.min(loser.gdp*(decisive?.06:.03),winner.gdp*(decisive?.03:.015));
   if(!S.options.noDebt){loser.debt+=reparations;winner.debt=Math.max(0,winner.debt-reparations);}
   loser.stability=clamp(loser.stability-(decisive?16:8),3,97);
   loser.approval=clamp(loser.approval-(decisive?14:6),3,97);
   winner.approval=clamp(winner.approval+(decisive?6:1),3,97);
   setRelation(a.id,b.id,-45);
   const casualties=(a.war.casualties+b.war.casualties);
   addEvent(decisive?'The front collapses':'Ceasefire agreed',
    decisive
     ?loser.name+'’s line gave way after '+a.war.months+' months. '+winner.name+' takes the terms it asks for: reparations, a ceasefire, and no change to the border on the map.'
     :'After '+a.war.months+' months neither army could break the other. '+winner.name+' holds the better position and secures reparations. Borders are unchanged.',
    'security');
   if([a.id,b.id].includes(S.player))
    addEvent('The cost of the war','Between them the two armies lost the equivalent of '+casualties.toFixed(1)+' index points of strength. Readiness and stability will take years to rebuild.','warning');
   a.war=null;b.war=null;}
 }};

declareWar=function(){

 const before=a.war;
 v10DeclareWarV11();
 if(!a.war||a.war===before)return;

 addEvent(land?'A front opens':'A war without a front',
  land
   ?a.name+' and '+b.name+' share a land border, and both armies are moving to it. The front will shift each month with the fighting.'
   :a.name+' and '+b.name+' share no land border. The war will be fought at sea and in the air, and ground will not change hands.',
  'security');
