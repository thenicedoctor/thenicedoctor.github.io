function sparkline(values){const low=Math.min(...values)*.996,high=Math.max(...values)*1.004,range=high-low||1;const pts=values.map((v,i)=>[i/Math.max(1,values.length-1)*300,70-(v-low)/range*63]);if(pts.length===1)pts.push([300,pts[0][1]]);const d=pts.map((p,i)=>(i?'L':'M')+p.map(v=>v.toFixed(1)).join(',')).join(' ');return '<svg class="trend" viewBox="0 0 300 80" preserveAspectRatio="none" aria-label="Output history"><defs><linearGradient id="fade" x2="0" y2="1"><stop stop-color="#8bb8a4" stop-opacity=".17"/><stop offset="1" stop-color="#8bb8a4" stop-opacity="0"/></linearGradient></defs><path d="'+d+' L300,80 L0,80 Z" fill="url(#fade)"/><path d="'+d+'" fill="none" stroke="#8bb8a4" stroke-width="1.8"/></svg>'}
function renderStats(){const n=player();$('stats').innerHTML='<div class="stat"><label>National output</label><div class="value">'+money(n.gdp)+'<small class="'+(n.growth<0?'negative':'')+'">'+pct(n.growth)+'</small></div></div><div class="stat"><label>Population</label><div class="value">'+(n.pop>=1000?(n.pop/1000).toFixed(2)+'B':n.pop.toFixed(1)+'M')+'</div></div><div class="stat"><label>Public approval</label><div class="value">'+n.approval.toFixed(0)+'%<small>'+(n.approval>55?'Supportive':'Contested')+'</small></div></div><div class="stat"><label>Political capital</label><div class="value">'+(infiniteCapital(n)?'∞':Math.floor(n.capital))+'<small>'+(infiniteCapital(n)?'Unlimited':'/ 100')+'</small></div></div>';$('date').textContent=dateText();$('performance').textContent=S.nations.length+' nations · '+(perf?perf.toFixed(1)+' ms / month':'Simulation ready');$('mapcaption').textContent='Playing as '+n.name+' · '+(playing?'Time is advancing':'Time is paused');}
function renderEvents(){const es=S.events.slice(0,3);$('events').innerHTML=es.map(e=>'<article class="event"><div class="tag '+(e.tag==='warning'?'warning':'')+'">'+escapeHTML(e.tag)+'</div><p>'+escapeHTML(e.title)+'. '+escapeHTML(e.body.slice(0,95))+(e.body.length>95?'…':'')+'</p><time>'+new Date(Date.UTC(2026,8+e.month,1)).toLocaleDateString('en',{month:'short',year:'numeric',timeZone:'UTC'})+'</time></article>').join('');}
function renderHead(){const n=current(),owned=n.id===S.player;const tabs=view==='policies'?[['reforms','Reforms'],['programs','Programs'],['taxation','Taxation'],['ideologies','Ideologies']]:view==='overview'?[['overview','Overview'],['society','Society']]:[];$('countryhead').innerHTML='<div class="eyebrow">'+(owned?'Your nation':'Nation intelligence')+'</div><div class="countryrow"><span class="flag">'+n.flag+'</span><h2>'+escapeHTML(n.name)+'</h2></div><div class="countrymeta">'+regime(n)+'</div><select aria-label="Select nation" id="nationSelect">'+[...S.nations].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>'<option value="'+c.id+'"'+(c.id===n.id?' selected':'')+'>'+c.name+'</option>').join('')+'</select><div class="subtabs">'+tabs.map(([k,label])=>'<button data-sub="'+k+'" class="'+(subview===k||(k==='programs'&&subview==='program')?'active':'')+'">'+label+'</button>').join('')+'</div>';$('nationSelect').onchange=e=>choose(e.target.value);$('countryhead').querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{subview=b.dataset.sub;renderHead();renderPanel()});}
function overview(n){const ide=ideology(n.policies);if(subview==='society')return '<div class="block"><h3>Society & institutions</h3>'+metric('Civil liberties',n.policies.liberties.toFixed(0)+' / 100')+metric('Institutional strength',n.capacity.toFixed(0)+' / 100')+metric('Income inequality',n.inequality.toFixed(1)+' / 100')+metric('Unemployment',n.unemployment.toFixed(1)+'%')+metric('Human capital',n.human.toFixed(0)+' / 100')+metric('Clean energy progress',n.clean.toFixed(0)+' / 100')+metric('Urban population',n.urban.toFixed(1)+'%')+metric('Living informally',n.slums.toFixed(1)+'%')+metric('Public housing stock',n.publicHousing.toFixed(1)+'% of housing need')+metric('Effective renter burden',n.rentBurden.toFixed(1)+'% of income')+metric('Housing supply index',n.housingSupply.toFixed(0)+' / 100')+'</div><div class="block"><h3>Political calendar</h3>'+metric('Next election',n.policies.institutions>=60?n.election+' months':'No competitive cycle')+'<p>Institutions and liberties are independent of the left–right economic spectrum. Elections renew political capital or bring a coalition that moderates policy.</p></div><p class="note">Social indicators are game indices. They are not measured current country scores.</p>';
return (n.id!==S.player?'<button class="primary full" data-action="assume">Play as '+escapeHTML(n.name)+'</button><p>Switch perspective without restarting the world.</p>':'<div class="hudtip">Your next move: draft a reform in <b>Policies</b>, then advance time with <b>▶</b> or <b>▸|</b>.</div>')+'<div class="block"><h3>National outlook</h3>'+metric('Stability',n.stability.toFixed(0)+' / 100','positive')+'<div class="bar"><div style="width:'+n.stability+'%"></div></div>'+metric('Public approval',n.approval.toFixed(0)+'%')+metric('Inflation',n.inflation.toFixed(1)+'%',n.inflation>6?'negative':'')+metric('Government debt',(n.debt/n.gdp*100).toFixed(1)+'% of GDP',n.debt/n.gdp>1?'neutral':'')+'</div><div class="block"><div class="sectionhead"><h3 style="margin:0">Economic trajectory</h3><span class="positive" style="font-size:12px">'+pct(n.growth)+'</span></div>'+sparkline(n.history)+'<div class="chartlabels"><span>START OF RECORDED PERIOD</span><span>'+dateText().toUpperCase()+'</span></div></div><div class="ideologybox"><div class="eyebrow">Economic policy profile</div><strong>'+ide.label+(ide.mixed?' · mixed':'')+'</strong><p>'+PRESETS[ide.label].desc+'</p></div><button class="full" data-action="policies">Shape domestic policy <span style="float:right">→</span></button><p class="keyboardhint">Space: play / pause &nbsp; · &nbsp; N: next month</p><p class="note">'+provenance(n)+'</p>';}
function policyControl(x,n){return(x.group?'<div class="eyebrow policygroup">'+x.group+'</div>':'')+'<div class="policy"><label class="metricrow" for="p-'+x.key+'"><span>'+x.name+'</span><output id="o-'+x.key+'">'+draft[x.key].toFixed(x.step<1?2:0)+' '+x.unit+'</output></label><input type="range" id="p-'+x.key+'" data-policy="'+x.key+'" min="'+x.min+'" max="'+x.max+'" step="'+x.step+'" value="'+draft[x.key]+'" '+(n.id!==S.player?'disabled':'')+'><div class="policylive"><span>Current: '+n.policies[x.key].toFixed(1)+'</span><span>Target: '+n.targets[x.key].toFixed(1)+'</span></div><small>'+x.desc+'</small></div>';}
function reformFooter(n){return '<div class="stickyaction"><div id="reformPreview"></div><button class="primary full" id="enact" '+(n.id!==S.player?'disabled':'')+'>Enact reform</button><button class="ghost full" data-action="discard">Reset draft to targets</button></div>';}
function policiesPanel(n){
 if(!draft)draft={...n.targets};
 if(subview==='ideologies')return '<h3>Choose a policy direction</h3><p>Presets stage an editable economic package. Your tax structure, housing programs, civil liberties and electoral safeguards stay independently adjustable.</p>'+Object.entries(PRESETS).map(([k,p])=>'<button class="preset" data-preset="'+k+'"><strong>'+k+' <span style="float:right;color:var(--accent)">↗</span></strong><small>'+p.desc+'</small></button>').join('')+'<p class="note">No ideology receives an automatic bonus. Outcomes emerge from its policies, institutional capacity and budget.</p>';
 if(subview==='taxation')return '<h3>Who pays what?</h3><p>Choose the tax structure, then set rates. The budget preview includes your other staged reforms.</p><label class="eyebrow" for="taxMode">Personal taxation system</label><select id="taxMode" class="full" '+(n.id!==S.player?'disabled':'')+'>'+TAX_MODES.map(m=>'<option value="'+m+'" '+(draft.taxMode===m?'selected':'')+'>'+TAX_NAMES[m]+'</option>').join('')+'</select><p class="note" id="taxExplanation">'+taxExplanation(draft.taxMode)+'</p>'+POLICY.filter(x=>(x.key==='tax'||x.tax)&&policyActive(x,draft)).map(x=>{const v={...x,group:undefined};if(BRACKET_KEYS.includes(x.key)){const i=BRACKET_KEYS.indexOf(x.key);v.name=draft.taxMode==='custom'?GROUPS[i].name+' · effective rate':['0–0.5× median · marginal','0.5–1.5× median · marginal','1.5–3× median · marginal','Above 3× median · marginal'][i];}return policyControl(v,n)}).join('')+'<div id="taxPreview"></div>'+reformFooter(n);
 if(subview==='programs')return programList(n);
 if(subview==='program')return programPage(n);
 return '<h3>Domestic reform</h3><p>Set policy targets. Implementation is gradual; construction and institutions take longer.</p><button class="full" data-action="taxation">Taxation · '+TAX_NAMES[draft.taxMode]+' →</button><button class="full" data-action="programs">Programs · urbanization, housing, debt relief →</button><p class="keyboardhint">Programs bundle the levers a policy actually needs, and show you what each one is doing month by month.</p>'+POLICY.filter(x=>x.key!=='tax'&&!x.tax).map(x=>policyControl(x,n)).join('')+reformFooter(n);
}
const progressBar=v=>'<div class="bar" style="margin:-6px 0 16px"><div style="width:'+clamp(v,0,100)+'%"></div></div>';
function programHeadline(key,n){const b=fiscal(n);
 if(key==='urban')return n.urban.toFixed(0)+'% urban · '+n.slums.toFixed(0)+'% informal · '+b.cityProgram.toFixed(2)+'% GDP committed';
 if(key==='housing')return n.publicHousing.toFixed(1)+'% of need met · rents at '+n.rentBurden.toFixed(0)+'% of income';
 if(key==='debt')return b.debtRatio.toFixed(0)+'% of GDP · '+b.interest.toFixed(1)+'% interest · '+b.debtService.toFixed(1)+'% GDP served';
 if(key==='human')return 'Human capital '+n.human.toFixed(0)+'/100 · '+(n.policies.services+n.policies.childcare).toFixed(1)+'% GDP committed';
 return 'Clean energy '+n.clean.toFixed(0)+'/100 · transition effort '+n.policies.climate.toFixed(0)+'/100';}
function programStatus(key,n){const b=fiscal(n),p=n.policies;
 if(key==='urban'){const strain=n.urbanStrain||0;return metric('Urban population',n.urban.toFixed(1)+'% of people')+progressBar(n.urban)+metric('Living informally',n.slums.toFixed(1)+'% of people',n.slums>25?'negative':n.slums<8?'positive':'')+progressBar(n.slums)+metric('Serviced city capacity',n.urbanCapacity.toFixed(0)+' / 100')+progressBar(n.urbanCapacity)+metric('Opening this month',n.urbanOpened.toFixed(3)+' capacity points')+metric('Under construction',n.urbanPipeline.reduce((a,v)=>a+v,0).toFixed(2)+' capacity points')+metric('Migration to cities',((n.migration||0)*12).toFixed(2)+' pp / year')+metric('Absorption',(strain>0?'Overrun by '+strain.toFixed(2):'Spare capacity '+Math.abs(strain).toFixed(2)),strain>0?'negative':'positive')+metric('Agglomeration effect on growth',pct(n.agglomeration),n.agglomeration>=0?'positive':'negative')+metric('Program cost',b.cityProgram.toFixed(2)+'% of GDP')+'<p>Districts open 18 months after ground is broken. When people arrive faster than serviced land, the excess becomes informal settlement, which pushes up rents and inequality and cancels the productivity gain of a bigger city.</p>';}
 if(key==='housing')return metric('Public housing stock',n.publicHousing.toFixed(1)+'% of need')+progressBar(n.publicHousing*1.25)+metric('Under construction',n.housingPipeline.reduce((a,v)=>a+v,0).toFixed(2)+'% of need')+metric('Completed this month',n.housingCompleted.toFixed(3)+' pp')+metric('Private supply response',n.housingSupply.toFixed(0)+' / 100')+metric('Effective renter burden',n.rentBurden.toFixed(1)+'% of income',n.rentBurden>40?'negative':n.rentBurden<25?'positive':'')+metric('Annual upkeep',b.housingMaintenance.toFixed(2)+'% of GDP')+'<p>Completions arrive 24 months after funding starts. Homes built stay built once construction spending is cut, but upkeep and 1.2% annual deterioration continue.</p>';
 if(key==='debt'){const headroom=Math.max(0,4.5-b.debtRatio/100);return metric('Debt stock',money(n.debt))+metric('Debt to output',b.debtRatio.toFixed(0)+'% of GDP',b.debtRatio>200?'negative':b.debtRatio<90?'positive':'')+progressBar(b.debtRatio/4.5)+metric('Interest rate carried',b.interest.toFixed(2)+'%')+metric('Annual interest bill',b.debtService.toFixed(2)+'% of GDP')+metric('Debt-management posture',p.borrowing.toFixed(0)+' / 100')+metric('Fiscal balance',pct(b.balance),b.balance>=0?'positive':'negative')+metric('Headroom to forced terms',(headroom*100).toFixed(0)+' pp of GDP',headroom<.5?'negative':'positive')+'<p>Interest only starts rising once debt passes 110% of output, and debt management buys the rate down further. Forced restructuring now waits until 450% of GDP, and a voluntary operation below that always costs less.</p>';}
 if(key==='human')return metric('Human capital',n.human.toFixed(0)+' / 100')+progressBar(n.human)+metric('Institutional capacity',n.capacity.toFixed(0)+' / 100')+progressBar(n.capacity)+metric('Unemployment',n.unemployment.toFixed(1)+'%')+metric('Income inequality',n.inequality.toFixed(1)+' / 100')+metric('Committed',(p.services+p.childcare+p.welfare).toFixed(2)+'% of GDP')+'<p>Human capital moves on a ten-year timescale and its ceiling depends on institutional capacity. Childcare pays back faster, through labor participation.</p>';
 return metric('Clean energy progress',n.clean.toFixed(0)+' / 100')+progressBar(n.clean)+metric('Transition effort',p.climate.toFixed(0)+' / 100')+progressBar(p.climate)+metric('Infrastructure',n.infra.toFixed(0)+' / 100')+progressBar(n.infra)+metric('Transition cost',(p.climate*.02).toFixed(2)+'% of GDP')+metric('Exposure to energy shocks',(100-n.clean).toFixed(0)+' / 100',n.clean>70?'positive':'')+'<p>Cleaner energy reduces the damage from the supply shocks that arrive later in a run. The stock moves slowly, so the effort has to be sustained.</p>';}
function reliefControls(n){const you=player(),cool=you.reliefCooldown||0,owned=n.id===S.player;return '<h3>Relief operations</h3>'+(cool>0?'<p class="note">Creditors are still digesting the last operation. '+Math.ceil(cool)+' months before another one.</p>':'<p class="keyboardhint">Voluntary operations, available at any debt level. Each costs political capital, not a crisis.</p>')+Object.entries(RELIEF).map(([k,r])=>'<button class="preset" data-relief="'+k+'" '+(!owned||cool>0?'disabled':'')+'><strong>'+r.name+' <span style="float:right;color:var(--accent)">'+(infiniteCapital(you)?'∞':r.cost+' capital')+'</span></strong><small>'+r.desc+'</small></button>').join('');}
function programList(n){return '<h3>Programs</h3><p>Named packages you can open, stage and then manage month by month. Each one bundles the levers it needs and reports what it is actually doing.</p>'+PROGRAMS.map(pr=>'<button class="preset" data-program="'+pr.key+'"><strong>'+pr.name+' <span style="float:right;color:var(--accent)">→</span></strong><small>'+pr.tag+' · '+programHeadline(pr.key,n)+'</small></button>').join('')+'<p class="note">Opening a program commits nothing. Stage it, check the budget line, then enact.</p>';}
function programPage(n){const pr=PROGRAMS.find(x=>x.key===activeProgram)||PROGRAMS[0];
 return '<button class="ghost full" data-action="programs" style="text-align:left">← All programs</button><h3>'+pr.name+'</h3><p>'+pr.blurb+'</p><div id="programLive">'+programLive(pr,n)+'</div>'+pr.keys.map(k=>policyControl({...POLICY.find(x=>x.key===k),group:undefined},n)).join('')+reformFooter(n);}
// The live block re-renders on every tick; the sliders around it must not, or a drag in progress would be lost.
function programLive(pr,n){return '<div class="block">'+programStatus(pr.key,n)+'</div>'+(pr.key==='debt'?reliefControls(n)+'<div class="policygroup eyebrow">Ongoing settings</div>':'<button class="full" data-stage="'+pr.key+'" '+(n.id!==S.player?'disabled':'')+'>Stage the full program</button><p class="keyboardhint">'+pr.stageNote+'</p>');}
function refreshProgramLive(){const box=$('programLive'),pr=PROGRAMS.find(x=>x.key===activeProgram);if(!box||!pr)return;box.innerHTML=programLive(pr,current());bindPrograms();}
function debtRelief(kind){const n=player(),r=RELIEF[kind];if(!r)return;
 if(n.reliefCooldown>0){toast('Creditors need '+Math.ceil(n.reliefCooldown)+' more months.');return;}
 if(!S.options.freeReforms&&!canSpend(n,r.cost)){toast('Not enough political capital for this operation.');return;}
 if(!S.options.freeReforms)spendCapital(n,r.cost);
 n.reliefCooldown=r.cooldown;
 if(kind==='terms'){n.targets.borrowing=clamp(n.targets.borrowing+20,0,100);n.policies.borrowing=clamp(n.policies.borrowing+12,0,100);addEvent('Maturities renegotiated',n.name+' lengthened the maturity profile of its debt. Carrying costs fall gradually.','economy');}
 if(kind==='refinance'){n.debt*=.93;n.targets.borrowing=clamp(n.targets.borrowing+12,0,100);n.policies.borrowing=clamp(n.policies.borrowing+8,0,100);addEvent('Concessional refinancing agreed',n.name+' swapped market debt for concessional lending. About 7% of the stock was written off.','economy');}
 if(kind==='restructure'){n.debt*=.7;n.approval=clamp(n.approval-7,5,95);n.growth-=1.2;n.debtWarned=0;for(const o of S.nations)if(o.id!==n.id)setRelation(n.id,o.id,relation(n.id,o.id)-6);addEvent('Sovereign debt restructured',n.name+' negotiated a 30% write-down. Creditors and partners took it badly; the budget did not.','economy');}
 if(draft)draft.borrowing=n.targets.borrowing;
 render();toast(r.name+' completed.');}
function taxExplanation(mode){return mode==='simple'?'An overall tax-to-GDP setting, preserving the original game model. Income groups share an assumed flat personal-tax component.':mode==='flat'?'Every group pays the same percentage of personal income. Other taxes and contributions are budget revenue measured as a share of GDP.':mode==='progressive'?'Marginal rates apply only to the income slice in each bracket. A higher bracket never reprices the income below it. Set the first rate to 0% for a tax-free first bracket.':'Each representative income group pays its own effective rate on its whole income. This is a sandbox group model, not marginal tax brackets.';}
function renderTaxPreview(){if(!$('taxPreview')||!draft)return;const n=current(),t=taxation(draft),median=n.gdp/n.pop*1000*PERSONAL_SHARE/INCOME_MEAN,problem=taxProblem(draft);$('taxPreview').innerHTML=(problem?'<p class="note negative">'+problem+'</p>':'')+'<h3>Representative people · at target rates</h3><p class="keyboardhint">Illustrative median personal income: $'+Math.round(median).toLocaleString()+'/year. Group weights are game assumptions.</p>'+t.groups.map(g=>'<div class="minicard" style="margin:10px 0"><label>'+g.name+' · '+Math.round(g.share*100)+'% of people</label>'+metric('Gross yearly income','$'+Math.round(g.income*median).toLocaleString())+metric('Personal tax rate',g.effective.toFixed(1)+'% effective')+metric('After personal tax','$'+Math.round((g.income-g.tax)*median).toLocaleString())+'</div>').join('')+metric('Personal income tax revenue',t.personal.toFixed(1)+'% GDP before collection')+'<p class="note">Personal income is assumed to be 65% of GDP. Actual revenue also depends on collection capacity. Brackets scale with modeled median income; no country’s real tax law is reproduced.</p>';}
function updateReformPreview(){refreshProgramLive();if(!$('reformPreview')||!draft)return;const n=current(),b=fiscal(n,draft),cost=reformCost(n,draft),problem=taxProblem(draft);$('reformPreview').innerHTML=(problem?'<p class="negative">'+problem+'</p>':'')+'<p>Budget at target policies: <b class="'+(b.balance<0?'negative':'positive')+'">'+pct(b.balance)+' of GDP</b> annually.<br>Includes current housing upkeep; future stock needs more maintenance.</p>';$('enact').textContent=infiniteCapital(n)?'Enact reform · ∞ capital':S.options.freeReforms?'Enact reform · free reforms':'Enact reform · '+cost+' capital';$('enact').disabled=n.id!==S.player||(!S.options.freeReforms&&!canSpend(n,cost))||cost===0||!!problem;renderTaxPreview();}
function economyPanel(n){const b=fiscal(n);return '<div class="block"><h3>National accounts</h3><div class="previewgrid"><div class="minicard"><label>Annual output</label><strong>'+money(n.gdp)+'</strong></div><div class="minicard"><label>Output per person</label><strong>$'+Math.round(n.gdp/n.pop*1000).toLocaleString()+'</strong></div></div>'+metric('Annual real growth',pct(n.growth),n.growth>=0?'positive':'negative')+metric('Inflation',n.inflation.toFixed(1)+'%')+metric('Central-bank rate',n.policies.rate.toFixed(1)+'%')+sparkline(n.history)+'</div><div class="block"><h3>Annual public budget · % of GDP</h3>'+metric('Personal income tax',b.personalRevenue.toFixed(1)+'%')+metric('Other taxes & contributions',b.otherRevenue.toFixed(1)+'%')+metric('Public-asset revenue',b.assetRevenue.toFixed(1)+'%')+metric('Total revenue',b.revenue.toFixed(1)+'%')+metric('Public services',n.policies.services.toFixed(1)+'%')+metric('Social protection',n.policies.welfare.toFixed(1)+'%')+metric('Infrastructure',n.policies.investment.toFixed(1)+'%')+metric('Defense',n.policies.defense.toFixed(1)+'%')+metric('Public housing construction',n.policies.housing.toFixed(2)+'%')+metric('Public housing upkeep',b.housingMaintenance.toFixed(2)+'%')+metric('Rent assistance',n.policies.rentAid.toFixed(2)+'%')+metric('Public transport',n.policies.transit.toFixed(2)+'%')+metric('Childcare',n.policies.childcare.toFixed(2)+'%')+metric('City building',n.policies.urbanization.toFixed(2)+'%')+metric('Industrial drive',n.policies.industrial.toFixed(2)+'%')+metric('Settlement upgrading',n.policies.slumUpgrade.toFixed(2)+'%')+metric('Rural development',n.policies.ruralInvest.toFixed(2)+'%')+metric('Debt management',b.debtAdmin.toFixed(2)+'%')+metric('Transition & administration',(5+n.policies.climate*.02).toFixed(1)+'%')+metric('Interest payments',b.debtService.toFixed(1)+'%')+metric(b.balance>=0?'Fiscal surplus':'Fiscal deficit',pct(b.balance),b.balance>=0?'positive':'negative')+metric('Debt stock',money(n.debt))+'</div><div class="block"><h3>Housing program</h3>'+metric('Public housing stock',n.publicHousing.toFixed(1)+'% of need')+metric('Under construction',n.housingPipeline.reduce((a,v)=>a+v,0).toFixed(2)+'% of need')+metric('Completed this month',n.housingCompleted.toFixed(3)+' percentage points')+metric('Effective renter burden',n.rentBurden.toFixed(1)+'% of income')+'<p>Projects take 24 months. Built homes remain after construction funding is cut, with ongoing upkeep and gradual deterioration.</p></div><div class="block"><h3>Urbanization</h3>'+metric('Urban population',n.urban.toFixed(1)+'%')+metric('Living informally',n.slums.toFixed(1)+'%')+metric('Serviced city capacity',n.urbanCapacity.toFixed(0)+' / 100')+metric('Migration to cities',((n.migration||0)*12).toFixed(2)+' pp / year')+metric('Agglomeration effect on growth',pct(n.agglomeration))+'</div><div class="block"><h3>Debt position</h3>'+metric('Debt to output',b.debtRatio.toFixed(0)+'% of GDP')+metric('Interest rate carried',b.interest.toFixed(2)+'%')+metric('Annual interest bill',b.debtService.toFixed(2)+'% of GDP')+metric('Debt-management posture',n.policies.borrowing.toFixed(0)+' / 100')+'<p>Interest rises only above 110% of output. Relief operations are in Policies → Programs → Debt relief.</p></div><p class="note">Output and debt use constant 2026 US dollars. Initial values are rounded scenario assumptions. Debt accumulates monthly; interest costs respond to rates and debt pressure.</p><button class="full" data-action="policies">Adjust fiscal policy →</button>';}
function diplomacyPanel(n){const p=player(),self=n.id===p.id;const choices=S.nations.filter(x=>x.id!==p.id).sort((a,b)=>b.gdp-a.gdp);return '<h3>Foreign relations</h3><p>'+(self?'Select another nation to negotiate, trade, or apply sanctions.':'Relations with '+p.name+' are '+(relation(p.id,n.id)>20?'cooperative':relation(p.id,n.id)>-20?'pragmatic':'strained')+'.')+'</p>'+(self?'<label class="eyebrow" for="partner">Diplomatic partner</label><select id="partner" class="full">'+choices.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('')+'</select><button class="primary full" id="inspectPartner">Open diplomatic channel →</button>':'<div class="block">'+metric('Bilateral relations',Math.round(relation(p.id,n.id))+' / 100')+'<div class="bar"><div style="width:'+(relation(p.id,n.id)+100)/2+'%"></div></div>'+metric('Trade agreement',hasTreaty(p.id,n.id)?'Active':'None')+metric('Sanctions',S.sanctions.includes(pair(p.id,n.id))?'Active':'None')+'</div><button class="full" data-diplomacy="improve" '+(!canSpend(p,8)?'disabled':'')+'>Improve relations · 8 capital</button><button class="full" data-diplomacy="trade" '+(hasTreaty(p.id,n.id)||!canSpend(p,15)||p.war?.target===n.id?'disabled':'')+'>Propose trade agreement · 15 capital</button><p>Agreements require relations above 25 and openness above 40 in both nations.</p><button class="full" data-diplomacy="sanction">'+(S.sanctions.includes(pair(p.id,n.id))?'Lift sanctions':'Impose sanctions · 10 capital')+'</button><p>Sanctions reduce output in both nations and damage bilateral relations.</p>')+'<div class="block" style="margin-top:24px"><h3>Your active agreements</h3>'+(S.treaties.filter(t=>t.split(':').includes(p.id)).map(t=>metric(nation(t.split(':').find(id=>id!==p.id)).name,'Trade pact')).join('')||'<p>No trade agreements yet.</p>')+'</div><p class="note">Diplomacy starts from neutral game assumptions. Real alliances and ongoing conflicts are not recreated.</p>';}
function diplomacy(action){const p=player(),n=current();if(p.id===n.id)return;const key=pair(p.id,n.id);if(p.war?.target===n.id&&action!=='sanction'){toast('Negotiate peace before opening diplomatic channels.');return}if(action==='improve'){if(!canSpend(p,8))return;spendCapital(p,8);setRelation(p.id,n.id,relation(p.id,n.id)+14);toast('Diplomatic outreach improved relations by 14.')}if(action==='trade'){if(!canSpend(p,15)||hasTreaty(p.id,n.id))return;if(relation(p.id,n.id)<25||Math.min(p.policies.trade,n.policies.trade)<40){toast('Agreement declined: improve relations and trade openness.');return}spendCapital(p,15);S.treaties.push(key);addEvent('Trade agreement signed',p.name+' and '+n.name+' open new markets. Output benefits build over time.','diplomacy');toast('Trade agreement signed.')}if(action==='sanction'){if(S.sanctions.includes(key)){S.sanctions=S.sanctions.filter(t=>t!==key);setRelation(p.id,n.id,relation(p.id,n.id)+10);toast('Sanctions lifted.')}else{if(!canSpend(p,10)){toast('You need 10 political capital.');return}spendCapital(p,10);S.sanctions.push(key);S.treaties=S.treaties.filter(t=>t!==key);setRelation(p.id,n.id,relation(p.id,n.id)-30);addEvent('Sanctions imposed',p.name+' restricts commerce with '+n.name+'. Both economies face disruption.','diplomacy');toast('Sanctions imposed.')}}render();requestDraw();}
function militaryPanel(n){const p=player();return '<div class="block"><h3>Defense & readiness</h3>'+metric('Annual defense budget',money(n.gdp*n.policies.defense/100))+metric('Defense share',n.policies.defense.toFixed(1)+'% of GDP')+metric('Equipment & logistics index',n.military.toFixed(0))+metric('Operational readiness',n.readiness.toFixed(0)+'%')+'<div class="bar"><div style="width:'+n.readiness+'%;background:var(--blue)"></div></div><p>Spending accumulates into military capability over years. Institutions improve delivery. War damages output, equipment and public support.</p></div>'+(n.war?'<div class="ideologybox"><div class="eyebrow">Active conflict</div><strong>'+nation(n.war.target).name+'</strong>'+metric('Duration',n.war.months+' months')+metric('Strategic balance',n.war.progress.toFixed(0))+'</div>'+(n.id===p.id||p.war?.target===n.id?'<button class="full" data-action="peace">Negotiate ceasefire</button>':''):n.id!==p.id?'<button class="danger full" data-action="war" '+(p.war?'disabled':'')+'>Consider military action</button>':'<p>No active conflict. Select another nation on the map to assess military action.</p>')+'<button class="full" data-action="policies">Change defense spending →</button><p class="note">Conflict is an abstract strategic model, with conventional forces only. Settlements create reparations rather than instant annexation. No real conflicts are active at scenario start.</p>';}
function declareWar(){const a=player(),b=current();if(a.id===b.id||a.war||b.war){toast('One of these nations is already in a conflict.');return}if(!canSpend(a,25)){toast('Military action requires 25 political capital.');return}spendCapital(a,25);a.war={target:b.id,months:0,progress:0};b.war={target:a.id,months:0,progress:0};a.approval-=12;a.stability-=5;setRelation(a.id,b.id,-95);S.treaties=S.treaties.filter(t=>t!==pair(a.id,b.id));addEvent('Conflict breaks out',a.name+' and '+b.name+' enter a conventional conflict. Output and civilian confidence fall.','warning');closeModal();render();requestDraw()}
function peace(){const a=player();if(!a.war)return;const b=nation(a.war.target);a.war=null;b.war=null;setRelation(a.id,b.id,-30);addEvent('Diplomacy ends the fighting',a.name+' and '+b.name+' agree to an immediate ceasefire. Recovery will take time.','diplomacy');toast('Ceasefire agreed.');render();requestDraw()}
function settingsPanel(){return '<h3>Sandbox rules</h3><p>Make the world as constrained or experimental as you like.</p><label class="toggleline">Other nations adjust their policies<input type="checkbox" data-option="ai" '+(S.options.ai?'checked':'')+'></label><label class="toggleline">Economic events and supply shocks<input type="checkbox" data-option="shocks" '+(S.options.shocks?'checked':'')+'></label><label class="toggleline">Infinite political capital<input type="checkbox" data-option="infiniteCapital" '+(S.options.infiniteCapital?'checked':'')+'></label><p>Unlimited political capital for reforms, diplomacy and military actions. Economic budgets, debt, and construction time still apply.</p><label class="toggleline">Free reforms only<input type="checkbox" data-option="freeReforms" '+(S.options.freeReforms?'checked':'')+'></label><div class="block"></div><h3>Your scenario</h3><button class="full" data-action="editScenario">Edit selected nation’s starting conditions</button><p>Directly change output, debt, stability and institutional capacity at any point.</p><div class="block"></div><h3>Save & resume</h3><button class="full" data-action="save">Save to this browser</button><button class="full" data-action="load">Load browser save</button><button class="full" data-action="export">Export save file</button><button class="full" data-action="import">Import save file</button><p>Saves stay on your device. Export a file for a portable backup.</p><button class="danger full" data-action="reset">Start a new world</button>';}
function renderPanel(){const n=current();$('panel').innerHTML=view==='overview'?overview(n):view==='policies'?policiesPanel(n):view==='economy'?economyPanel(n):view==='diplomacy'?diplomacyPanel(n):view==='military'?militaryPanel(n):view==='history'?'<h3>World dispatch archive</h3>'+S.events.map(e=>'<div class="logentry"><time>MONTH '+e.month+' · '+escapeHTML(e.tag).toUpperCase()+'</time><p><strong>'+escapeHTML(e.title)+'</strong><br>'+escapeHTML(e.body)+'</p></div>').join(''):settingsPanel();bindPanel();updateReformPreview();}
function bindPrograms(){
 $('panel').querySelectorAll('[data-program]').forEach(b=>b.onclick=()=>{activeProgram=b.dataset.program;subview='program';renderHead();renderPanel();});
 $('panel').querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{const pr=PROGRAMS.find(x=>x.key===b.dataset.stage);draft={...draft,...pr.stage};dirty=true;renderPanel();toast(pr.name+' staged. Review the budget, then enact.');});
 $('panel').querySelectorAll('[data-relief]').forEach(b=>b.onclick=()=>debtRelief(b.dataset.relief));}
function bindPanel(){bindPrograms();if($('taxMode'))$('taxMode').onchange=e=>{draft.taxMode=e.target.value;if(draft.taxMode==='progressive'){const ordered=BRACKET_KEYS.map(k=>draft[k]).sort((a,b)=>a-b);BRACKET_KEYS.forEach((k,i)=>draft[k]=ordered[i]);}dirty=true;renderPanel();};if($('housingPackage'))$('housingPackage').onclick=()=>{draft={...draft,housing:6,zoning:80};dirty=true;renderPanel();toast('Mass housing staged: 6% GDP construction and permitting reform.');};$('panel').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>actions[b.dataset.action]?.());$('panel').querySelectorAll('[data-policy]').forEach(el=>el.oninput=()=>{draft[el.dataset.policy]=Number(el.value);dirty=true;const x=POLICY.find(x=>x.key===el.dataset.policy);$('o-'+x.key).textContent=Number(el.value).toFixed(x.step<1?2:0)+' '+x.unit;updateReformPreview();});$('panel').querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const p={...PRESETS[b.dataset.preset]};delete p.desc;const keep=draft||current().targets;draft={...keep,...p};for(const key of ['taxMode',...TAX_KEYS,'housing','rentAid','zoning','transit','childcare'])draft[key]=keep[key];dirty=true;subview='reforms';renderHead();renderPanel();toast('Preset staged. Adjust the sliders, then enact.');});if($('enact'))$('enact').onclick=()=>{try{enact(draft)}catch(e){toast(e.message)}};if($('inspectPartner'))$('inspectPartner').onclick=()=>choose($('partner').value);$('panel').querySelectorAll('[data-diplomacy]').forEach(b=>b.onclick=()=>diplomacy(b.dataset.diplomacy));$('panel').querySelectorAll('[data-option]').forEach(el=>el.onchange=()=>{S.options[el.dataset.option]=el.checked;renderStats();toast(el.dataset.option==='infiniteCapital'?(el.checked?'Infinite political capital enabled.':'Normal political capital restored.'):'Sandbox rule updated.');});}
function render(){renderStats();renderEvents();$('navigation').innerHTML=[['overview','Overview'],['policies','Policies'],['economy','Economy'],['diplomacy','Diplomacy'],['military','Military'],['history','Dispatch']].map(([v,l])=>'<button data-view="'+v+'" class="'+(view===v?'active':'')+'" title="'+l+'">'+icon(v)+'<span class="navlabel">'+l+'</span></button>').join('')+'<div class="spacer"></div>'+[['settings','Sandbox'],['help','Guide']].map(([v,l])=>'<button data-view="'+v+'" class="'+(view===v?'active':'')+'" title="'+l+'">'+icon(v)+'<span class="navlabel">'+l+'</span></button>').join('');$('navigation').querySelectorAll('button').forEach(b=>b.onclick=()=>setView(b.dataset.view));renderHead();renderPanel();requestDraw();}
function renderTick(){renderStats();renderEvents();if((view!=='policies'||subview==='programs')&&view!=='settings'){const pos=$('panel').scrollTop;renderPanel();$('panel').scrollTop=pos;}else updateReformPreview();if($('mapmode').value!=='political'||S.nations.some(n=>n.war))requestDraw();}
let returnFocus=null,wasPlaying=false;
function modal(title,html){wasPlaying=playing;startPause(false);returnFocus=document.activeElement;$('modalContent').innerHTML='<h2 id="modalTitle">'+title+'</h2>'+html;$('overlay').hidden=false;$('closeModal').focus();}
function closeModal(){$('overlay').hidden=true;returnFocus?.focus?.();if(wasPlaying)startPause(true);}
function showGuide(){modal('The Sovereign field guide','<p>Lead any nation in an open-ended geopolitical sandbox. There is no single victory condition: pursue prosperity, liberty, influence, equality, or a balance of your own.</p><h3>Your first five minutes</h3><ol><li>Select a nation on the map or in the nation selector. Choose <b>Play as</b> to take control.</li><li>Open <b>Policies</b>. Adjust targets or stage an ideology preset, review its budget, and enact a reform.</li><li>Press <b>▶</b> to run time, or <b>▸|</b> to advance one month. Watch approval, inflation, debt and growth.</li><li>Open <b>Diplomacy</b> and select another nation to improve relations, negotiate trade or impose sanctions.</li><li>Use <b>Sandbox</b> to change conditions, enable infinite political capital, save or reset the world.</li></ol><h3>Realism and its limits</h3><p>This is a <b>2026 sandbox with approximate, hand-authored starting conditions</b>. Country values and institutional scores are scenario assumptions, not a current statistical database. The 52 featured nations use rounded scenario estimates. Other nations use historical Natural Earth population and GDP fields, mostly from 2019, without updating them to 2026; their remaining settings are generic defaults. Each nation’s overview shows its data basis. Simulation coefficients are stylized game assumptions, not forecasts. The embedded map includes 174 country and territory outlines. Canada is playable through its map marker and nation selector; its outline is not included. Antarctica is outside the simulation. Some small states are absent at this map resolution. Disputed boundaries are cartographic representations, not statements of recognition.</p><p>Economic policy, civil liberties and electoral safeguards are separate dimensions. Presets describe simplified policy tendencies; they do not label a country’s population. Actual governments mix different approaches. Reform targets take 6–30 months to move about two-thirds toward their target, while productive benefits take years.</p><h3>How the model works</h3><p>Every tick is one month. Taxes finance services, transfers, investment, defense, administration and interest. Deficits add to debt; inflation reduces its real value. Very high debt triggers restructuring. Growth responds gradually to capital, institutions, taxes, trade, real interest rates and shocks. Civil liberties have their own value and influence support. Elections can renew or replace a government, while you remain in control of the nation.</p><p>AI governments adjust taxes and rates every six months. Conflicts are abstract and resolve through attrition, reparations or ceasefire, with no instant territorial conquest. Initial alliances, wars, supply chains, currencies, ethnic groups and military inventories are not reconstructed. Central-bank control is a sandbox simplification, including for currency unions.</p><h3>Personal taxes and public housing</h3><p>In Policies → Taxation, choose simple taxation, a flat income tax, progressive marginal brackets, or custom effective rates for four income groups. Under progressive taxation, only income within each bracket receives its rate. The first bracket can be tax-free. Custom group rates apply to a group’s whole income and can represent non-progressive experiments.</p><p>Four representative incomes and population weights are illustrative, with personal income totaling 65% of GDP. Tax revenue uses the weighted bills, and the inequality model uses after-tax income plus targeted transfers. Other taxes and contributions are a separate GDP share, so income taxes are not counted twice. Rates phase in over six months; a tax-system switch begins next month.</p><p>Mass public housing spends a chosen GDP share on new homes, with a 24-month construction pipeline and diminishing construction efficiency. Existing stock has annual upkeep of 0.035% of GDP per percentage point of housing need served, plus 1.2% annual deterioration. These are game coefficients. Rent assistance is less effective when supply is tight; permitting reform expands private supply gradually. Public transport and childcare are additional budget lines with delayed benefits. Housing stock, pipeline and effective renter burden appear under Economy and Society.</p><p>Sandbox → Infinite political capital removes all political-capital limits for the player without storing infinity as a number. Public budgets, debt, reform lags and physical construction limits remain active. Existing browser saves and exported version 1 saves migrate automatically.</p><h3>Programs, urbanization and debt relief</h3><p>Policies → Programs holds five clickable packages: mass urbanization, mass public housing, debt relief, a human-capital drive and the energy transition. Opening one shows its live state, its own sliders and a one-click button that stages the whole package as a draft reform. Nothing is committed until you enact it, and everything inside a program is still an ordinary policy you can move by hand.</p><p>Urbanization models three things at once. City building puts serviced land into an 18-month pipeline; the industrial drive and the rural-development budget set how strongly people are pulled toward cities; and upgrading, public housing and transport determine how much of that arrival the city can absorb. Migration beyond absorption capacity becomes informal settlement, which raises rents and inequality and cancels out the productivity gain a larger city would otherwise give. All coefficients are gameplay assumptions, not estimates of any real country.</p><p>Debt is deliberately forgiving in this version. Interest starts at roughly half of the policy rate, and the debt-ratio penalty only begins above 110% of output instead of 80%. The debt-management setting buys the rate down further. Three voluntary relief operations — renegotiated maturities, concessional refinancing and a 30% restructuring — are available at any debt level for political capital, with a cooldown between them. Forced restructuring now waits until 450% of GDP and costs far less than it used to. A warning dispatch arrives at 220%.</p><h3>Current policy patterns</h3><table><tr><th>Example</th><th>Why a single ideology label falls short</th></tr><tr><td>Germany · 2025</td><td>Private investment incentives coexist with infrastructure spending, housing measures and social policy.</td></tr><tr><td>UK · Budget 2025</td><td>Public-service investment and asset-income tax changes coexist with borrowing constraints.</td></tr><tr><td>China · 2026 plan</td><td>Industrial strategy coexists with market reforms and the energy transition. Official targets are intentions, not observed outcomes.</td></tr></table><h3>Sources checked September 2026</h3><ul><li><a target="_blank" rel="noopener noreferrer" href="https://www.sipri.org/publications/2026/sipri-fact-sheets/trends-world-military-expenditure-2025">SIPRI: military expenditure in 2025</a> — defense budgets and fiscal tradeoffs.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.imf.org/en/publications/fm/issues/2026/04/15/fiscal-monitor-april-2026">IMF Fiscal Monitor, April 2026</a> — debt pressure and interest costs.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.imf.org/en/publications/fm/issues/2025/10/07/fiscal-monitor-october-2025">IMF Fiscal Monitor, October 2025</a> — spending composition, efficiency and delayed benefits.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.ecb.europa.eu/mopo/intro/transmission/html/index.en.html">ECB: monetary-policy transmission</a> — rates affect demand and inflation with uncertain lags.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.v-dem.net/documents/75/V-Dem_Institute_Democracy_Report_2026_lowres.pdf">V-Dem Democracy Report 2026</a> — institutions, democracy and liberties are distinct dimensions.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.bundesregierung.de/breg-en/news/a-start-has-been-made-2379544">German government policy overview</a>; <a target="_blank" rel="noopener noreferrer" href="https://www.gov.uk/government/publications/budget-2025-document/budget-2025-html">UK Budget 2025</a>; <a target="_blank" rel="noopener noreferrer" href="https://english.www.gov.cn/news/202603/13/content_WS69b4b144c6d00ca5f9a09dfd.html">China’s 2026 Government Work Report</a>.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.naturalearthdata.com/downloads/110m-cultural-vectors/110m-admin-0-countries/">Natural Earth</a> — public-domain geographical reference.</li></ul><p>Sources inform qualitative mechanisms, not calibrated country scores or the numerical strength of policy effects.</p><h3>Tax and housing references</h3><ul><li><a target="_blank" rel="noopener noreferrer" href="https://www.irs.gov/filing/federal-income-tax-rates-and-brackets">IRS: how marginal income-tax brackets work</a>.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.oecd.org/content/dam/oecd/en/publications/reports/2017/12/income-redistribution-through-taxes-and-transfers-across-oecd-countries_2342ea51/bc7569c6-en.pdf">OECD research: redistribution through taxes and transfers</a>.</li><li><a target="_blank" rel="noopener noreferrer" href="https://www.oecd.org/en/publications/restoring-public-finances_fbcf9161-en/full-report/housing_ce593155.html">OECD: housing supply, maintenance and allowances</a>.</li></ul><h3>Performance</h3><p>A single self-contained file, with no runtime downloads or libraries. Map paths are cached; the map redraws only when needed. Simulation runs monthly and pauses background computation when the tab is hidden. Histories and event logs are bounded.</p>');}
